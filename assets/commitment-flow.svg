<text x="105" y="390" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">落户与背书</text>
<text x="105" y="463" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">身份电路承载长期履历</text>
<text x="105" y="509" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">计分预言另绑一枚胶囊</text>
