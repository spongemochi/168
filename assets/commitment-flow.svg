<polyline points="712,422 738,422" fill="none" stroke="#A77A22" stroke-width="3"/>
<polygon points="738,422 722.6923992600045,429.3944140798909 722.6923992600045,414.6055859201091" fill="#A77A22"/>
<rect x="740" y="285" width="300" height="295" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
<text x="765" y="311" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="45" font-weight="600" fill="#A77A22">03</text>
<text x="765" y="390" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">收录回执</text>
<text x="765" y="463" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">事前固定概率等参数</text>
<text x="765" y="509" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">哈希承诺随回执上链</text>
<polyline points="1042,422 1068,422" fill="none" stroke="#A77A22" stroke-width="3"/>
<polygon points="1068,422 1052.6923992600045,429.3944140798909 1052.6923992600045,414.6055859201091" fill="#A77A22"/>
<rect x="1070" y="285" width="300" height="295" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
