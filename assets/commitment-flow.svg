<text x="136" y="936" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#60655E">有依据的正面结果</text>
<rect x="640" y="850" width="520" height="145" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
