<text x="1095" y="390" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">到期揭示</text>
<text x="1095" y="463" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">公开单条消息解密依据</text>
<text x="1095" y="509" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">核对原文及参数承诺</text>
<polyline points="1372,422 1398,422" fill="none" stroke="#A77A22" stroke-width="3"/>
<polygon points="1398,422 1382.6923992600045,429.3944140798909 1382.6923992600045,414.6055859201091" fill="#A77A22"/>
<rect x="1400" y="285" width="300" height="295" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
