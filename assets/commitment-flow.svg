<text x="80" y="105" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="55" font-weight="600" fill="#20221F">从一句话，到可以核验的结果</text>
<text x="80" y="182" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="400" fill="#60655E">一条计分价格预言的目标流程 · 每个阶段都保留对应的消息与依据。</text>
