<text x="435" y="390" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">提交承诺</text>
<text x="435" y="463" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">固定原文、日期和条件</text>
