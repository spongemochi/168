<text x="1256" y="936" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#60655E">未完成有效揭示</text>
<text x="80" y="1030" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#60655E">三种状态分别展示；未揭示不等于已经判定未中。</text>
