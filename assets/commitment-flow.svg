<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1170" viewBox="0 0 1800 1170" role="img"><title>从一句话，到可以核验的结果</title><desc>一条计分价格预言的目标流程 · 每个阶段都保留对应的消息与依据。</desc>
