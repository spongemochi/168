<text x="80" y="1112" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#60655E">设计说明图 · 功能状态以文档中的交付范围为准</text>
<text x="1620" y="1112" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#A77A22">图 二</text>
