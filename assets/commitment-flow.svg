<text x="1425" y="390" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">裁决入档</text>
<text x="1425" y="463" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">记录结果、来源和时间</text>
<text x="1425" y="509" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">失败与异议同样保留</text>
<rect x="80" y="640" width="1640" height="140" rx="18" fill="#191E1B" stroke="none" stroke-width="2"/>
<text x="115" y="671" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="35" font-weight="600" fill="#F5E9C6">读者可以追问每一步</text>
<text x="115" y="727" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#E4E7E0">谁提交？何时提交？内容有无变化？谁裁决？依据是什么？</text>
<rect x="80" y="850" width="520" height="145" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
