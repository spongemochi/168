<text x="922" y="490" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">收录 · 揭示 · 裁决</text>
<polyline points="1480,560 1480,450" fill="none" stroke="#A77A22" stroke-width="3"/>
<polygon points="1480,450 1487.394414079891,465.3076007399955 1472.605585920109,465.3076007399955" fill="#A77A22"/>
<text x="1502" y="490" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#60655E">公开证据</text>
<rect x="80" y="560" width="1640" height="165" rx="18" fill="#191E1B" stroke="none" stroke-width="2"/>
<text x="120" y="595" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="600" fill="#F5E9C6">X Layer 链上消息中枢</text>
<text x="120" y="663" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="400" fill="#D5D8D1">TapeSend 保存消息关系；电路与容器提供身份和信箱。</text>
