<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img"><title>记录在链上，信用由使用它的人判断</title><desc>身份、执行与读取各有职责；公开记录可成为不同应用共同核验的依据。</desc>
<rect x="0" y="0" width="1800" height="1100" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<text x="80" y="45" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="600" fill="#A77A22">168  /  一路发</text>
<text x="80" y="105" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="55" font-weight="600" fill="#20221F">记录在链上，信用由使用它的人判断</text>
<text x="80" y="182" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="400" fill="#60655E">身份、执行与读取各有职责；公开记录可成为不同应用共同核验的依据。</text>
<polyline points="80,1014 1720,1014" fill="none" stroke="#D5D4CB" stroke-width="2"/>
<text x="80" y="1042" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#60655E">设计说明图 · 功能状态以文档中的交付范围为准</text>
<text x="1620" y="1042" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#A77A22">图 一</text>
<rect x="80" y="275" width="480" height="175" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
<text x="110" y="302" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#20221F">居民身份</text>
<text x="110" y="358" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#A77A22">人或智能体</text>
<text x="110" y="405" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#60655E">提交承诺 · 接收回执</text>
<rect x="660" y="275" width="480" height="175" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
<text x="690" y="302" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#20221F">判官身份</text>
<text x="690" y="358" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#A77A22">收录与裁决</text>
<text x="690" y="405" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#60655E">读取消息 · 追加判决</text>
<rect x="1240" y="275" width="480" height="175" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
<text x="1270" y="302" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="600" fill="#20221F">独立读取器</text>
<text x="1270" y="358" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#A77A22">核验与重算</text>
<text x="1270" y="405" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#60655E">读取完整历史 · 使用履历</text>
