<polygon points="1320,810 1312.605585920109,794.6923992600045 1327.394414079891,794.6923992600045" fill="#A77A22"/>
<rect x="80" y="810" width="780" height="140" rx="18" fill="#EBE4D3" stroke="none" stroke-width="2"/>
<text x="110" y="838" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">执行与索引服务</text>
<text x="110" y="895" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#60655E">处理定时任务、外部证据和查询加速</text>
<rect x="900" y="810" width="820" height="140" rx="18" fill="#FFFEFA" stroke="#D5D4CB" stroke-width="2"/>
<text x="930" y="838" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#20221F">可复用的履历</text>
<text x="930" y="895" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB, PingFang SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#60655E">同一份历史，不同应用可以采用不同规则</text>
