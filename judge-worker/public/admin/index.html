<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>168 · 判官工作台</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0d0b;color:#ece8dc;font:16px/1.8 system-ui,sans-serif}main{max-width:1000px;margin:60px auto;padding:0 24px}h1{font-family:serif;font-size:42px;font-weight:400}small,.hint{color:#a49d8d}a{color:#d4b674}button,input,select,textarea{font:inherit;border:1px solid #514837;background:#14130f;color:inherit;padding:10px 16px}button{cursor:pointer;color:#d4b674}button:disabled{opacity:.4;cursor:default}textarea,input{width:100%;margin:8px 0 20px}textarea{min-height:110px}section{border:1px solid #373329;padding:24px;margin:24px 0}code{overflow-wrap:anywhere;font-size:12px}#status,#publish-status{white-space:pre-wrap;color:#d4b674}#body,#reason{white-space:pre-wrap}label{display:block}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.check{display:flex;gap:12px}.check input{width:auto;margin:0}select{max-width:100%}</style>
<main><small>168 · 1.2.168</small><h1>判官工作台</h1><p>读取公开揭示，核对证据，再把裁决写回 X Layer。未完成链上确认的建议不会作为最终裁决。</p>
<div class="row"><button id="connect">连接判官钱包</button><button id="refresh">刷新链上案件</button><a href="https://1-2-168.tapekit.org/" target="_blank" rel="noopener">正式网站 ↗</a></div><p id="wallet" class="hint">公开案件无需连接钱包；发布裁决须持有判官电路。</p><p id="status" role="status"></p>
<section><h2>待处理承诺</h2><select id="cases"><option>正在读取…</option></select><p id="case-state"></p><code id="case-id"></code><p id="body"></p><p id="condition" class="hint"></p><p id="reason" class="hint"></p><a id="reveal-help" href="http://127.0.0.1:8171/#/me">尚未揭示？回原本地网页打开封存回执，使用对应揭示文件 ↗</a></section>
<section><h2>裁决与依据</h2><p class="hint">价格判断可自动准备历史取价建议；未固定规则的旧记录与“一件事”须人工核对。当前这些记录不补计判断分。</p>
<label>结论 <select id="outcome"><option value="hit">命中</option><option value="miss">未中</option><option value="undecidable">证据不足 · 无法裁决</option></select></label>
<label>依据与说明<textarea id="verdict-reason" placeholder="说明事实如何符合封存时的条件；无法判断时说明缺少什么"></textarea></label>
<label>公开证据链接<input id="source-url" type="url" placeholder="https://…"></label><label>证据名称<input id="source-name" placeholder="例如：官方公告或带时间的健康接口截图"></label>
<label>证据内容<textarea id="source-value" placeholder="具体事实或数值，不能仅写网址"></textarea></label>
<label>证据时间 · 北京时间<input id="source-time" type="datetime-local"></label>
<label class="check"><input id="confirm" type="checkbox">我已核对原文、条件与证据，确认公开此裁决。</label><p class="hint">TapeSend 消息费 0 OKB；X Layer 网络费由发出裁决的判官钱包支付。168 不额外收取服务费。</p><p id="publish-status" role="status" aria-live="polite"></p><button id="publish">核验并发布链上裁决</button></section></main><script type="module" src="./console.mjs"></script></html>
