<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>168 · 一路发｜封了，就改不了了。</title>
<style>
:root{
  --void:#000; --ink:#EFEDE6; --dim:#7E7B72; --faint:#3E3C36;
  --gold:#D8A93B; --gold2:#F4D89A; --line:#1A1A1E; --edge:#26251F;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --cjk:'Noto Serif SC','Songti SC','PingFang SC',serif;
  box-sizing:border-box;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--ink);font-family:var(--cjk)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.home{overflow:hidden;height:100%}
a{color:inherit;text-decoration:none}
canvas{position:fixed;inset:0;display:block}
#dust{z-index:0} #heap{z-index:1;cursor:pointer}
body:not(.home) #heap,body:not(.home) .veil{display:none}
body:not(.home) #dust{opacity:.55}
.veil{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(0,0,0,0) 28%,rgba(0,0,0,.74) 78%)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

/* ——— 顶栏 ——— */
.top{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;padding:22px 28px}
.top .tnav{justify-self:end}
.lang{justify-self:center;display:inline-flex;border:1px solid var(--line)}
.lang button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;background:none;border:0;color:var(--faint);padding:5px 11px;cursor:pointer;transition:.3s}
.lang button + button{border-left:1px solid var(--line)}
.lang button.sel{background:rgba(216,169,59,.12);color:var(--gold2)}
.lang button:hover{color:var(--ink)}
.mark{font-family:var(--mono);font-size:15px;letter-spacing:.34em;color:var(--dim)}
.mark b{color:var(--gold2);font-weight:500}
.tnav{display:flex;gap:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.tnav a.on,.tnav a:hover{color:var(--gold2)}

/* ——— 首页 ——— */
.ui{position:relative;z-index:3;height:calc(100vh - 68px);display:flex;flex-direction:column;pointer-events:none}
.ui > *{pointer-events:auto}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 20px;margin-top:-5vh;
  transition:opacity .5s,transform .5s;pointer-events:none}
.mid > *{pointer-events:auto}
.mid.hushed{opacity:0;transform:translateY(-10px);pointer-events:none}
.risen{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:900px}
.cap{width:180px;border:1px solid var(--line);background:rgba(10,10,12,.55);padding:11px 13px 12px;display:block;cursor:pointer;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),border-color .5s,background .5s;animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.cap:hover{transform:translateY(-10px);border-color:var(--edge);background:rgba(14,14,16,.82)}
.cap .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.cap .t{font-size:12.5px;line-height:1.55;color:var(--dim);margin:7px 0 9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .b{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dot.g{background:var(--gold);box-shadow:0 0 8px rgba(216,169,59,.85)}
.dot.b{background:#2C2A24} .dot.w{background:transparent;border:1px solid var(--faint)}
.cap.hot{border-color:rgba(216,169,59,.34)} .cap.hot .b{color:var(--gold)}
.line{font-size:clamp(19px,2.3vw,26px);letter-spacing:.08em;text-align:center;font-weight:500}
.line em{font-style:normal;color:var(--gold2)}
.why{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-align:center;margin-top:-16px}
.why b{color:var(--dim);font-weight:400;border-bottom:1px dotted #33312B;cursor:help}
.bar{width:min(660px,92vw);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:14px;padding:12px 4px;transition:border-color .4s}
.bar:focus-within{border-color:#4A4536}
.bar input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-family:var(--cjk);font-size:16px;letter-spacing:.04em}
.bar input::placeholder{color:#49473F}
.go{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);border:1px solid var(--line);background:none;
  padding:8px 14px;cursor:pointer;text-transform:uppercase;white-space:nowrap;transition:.35s}
.go:hover,.go.on{color:var(--gold2);border-color:rgba(216,169,59,.45)}
.meta{width:min(660px,92vw);display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:-14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);min-height:18px;flex-wrap:wrap}
.meta .when{display:flex;gap:8px;align-items:center}
.meta button{font:inherit;background:none;border:0;border-bottom:1px dotted #3A382F;color:var(--dim);cursor:pointer;padding:0 0 2px}
.meta button.sel{color:var(--gold2);border-bottom-color:rgba(216,169,59,.5)}
.meta input[type=date]{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;background:none;border:0;
  border-bottom:1px dotted #3A382F;color:var(--gold2);padding:0 2px 2px;color-scheme:dark;cursor:pointer}
.meta input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.55);cursor:pointer}
.cbox .sign{margin:2px 0 4px}
.cbox .sign label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.cbox .sign input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--ink);
  font-family:var(--cjk);font-size:15px;padding:6px 2px}
.cbox .sign input:focus{border-bottom-color:#4A4536}
.cbox .sign input::placeholder{color:#3E3C36}
.cbox .sign small{display:block;margin-top:8px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--faint)}
.pubpick{display:inline-flex;border:1px solid var(--line)}
.pubpick button{font-family:var(--cjk);font-size:13.5px;background:none;border:0;color:var(--faint);padding:7px 18px;cursor:pointer;transition:.3s}
.pubpick button + button{border-left:1px solid var(--line)}
.pubpick button.sel{background:rgba(216,169,59,.12);color:var(--gold2)}
.meta .no{opacity:0;transition:opacity .5s} .meta .no.show{opacity:1}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 22px;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.bottom a{border-bottom:1px solid #1E1D19;padding-bottom:2px} .bottom a:hover{color:var(--dim)}
.count b{color:var(--dim);font-weight:400}

/* ——— 内页 ——— */
.page{position:relative;z-index:3;max-width:1080px;margin:0 auto;padding:8px 28px 90px}
.back{display:inline-flex;align-items:center;gap:9px;margin:10px 0 -6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--faint);transition:.3s}
.back:hover{color:var(--gold2)} .back span{font-size:14px;line-height:1}
.head{padding:26px 0 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head h1{margin:6px 0 0;font-size:clamp(23px,2.6vw,31px);font-weight:500;letter-spacing:.04em}
.head .side{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);text-align:right}
.filters{display:flex;gap:18px;padding:16px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.filters button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:2px 0;border-bottom:1px solid transparent}
.filters button.on{color:var(--gold2);border-bottom-color:rgba(216,169,59,.5)}

.rows{margin-top:6px}
.row{display:grid;grid-template-columns:76px 1fr 190px 92px;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .3s}
.row:hover{background:rgba(255,255,255,.018)}
.row .id{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em}
.row .txt{font-size:14.5px;line-height:1.6}
.row .txt small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:5px;letter-spacing:.1em}
.row .st{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.row .seal{justify-self:end}
.seal{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.seal.g{background:linear-gradient(150deg,var(--gold2),var(--gold));color:#17150C;box-shadow:0 0 20px rgba(216,169,59,.25)}
.seal.b{background:#15140F;border:1px solid #33302A;color:#5E5A4C}
.seal.w{border:1px dashed #33312B;color:var(--faint)}

/* 判决页 */
.verdict{max-width:760px;margin:0 auto}
.vtop{text-align:center;padding:46px 0 34px}
.vseal{width:92px;height:92px;border-radius:20px;margin:0 auto 26px;display:grid;place-items:center;font-family:var(--mono);
  font-size:13px;letter-spacing:.14em;animation:stamp .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes stamp{from{transform:scale(1.5) rotate(-8deg);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.vseal.g{background:linear-gradient(150deg,var(--gold2),var(--gold));color:#17150C;box-shadow:0 0 60px rgba(216,169,59,.3)}
.vseal.b{background:#111008;border:1px solid #33302A;color:#6A6555}
.vtop .said{font-size:clamp(20px,2.5vw,27px);line-height:1.62;letter-spacing:.04em;margin:0 auto;max-width:600px}
.vtop .locked{display:inline-block;border:1px dashed #33312B;color:var(--faint);font-family:var(--mono);font-size:13px;
  letter-spacing:.16em;padding:16px 28px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 8px,transparent 8px 16px)}
.vtop .who{margin-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:34px}
.cell{background:var(--void);padding:18px 20px}
.cell b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.cell .v{font-family:var(--mono);font-size:14px;color:var(--ink);word-break:break-all}
.cell .v small{color:var(--dim);font-size:11.5px}
.sources{margin-top:26px;border:1px solid var(--line)}
.sources .h{padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.src{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;align-items:center}
.src:last-child{border-bottom:0}
.src .n{color:var(--dim)} .src .p{color:var(--ink)} .src .l{color:var(--faint);font-size:10px}
.note{margin-top:26px;border-left:2px solid #2C2A22;padding:4px 0 4px 18px}
.note .q{font-size:15.5px;line-height:1.75}
.note .by{margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.12em}
.vfoot{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);
  padding:11px 20px;color:var(--dim);cursor:pointer;background:none;transition:.35s}
.btn:hover{color:var(--gold2);border-color:rgba(216,169,59,.4)}
.btn.hi2{color:#17150C;background:linear-gradient(150deg,var(--gold2),var(--gold));border-color:transparent}
.btn.hi2:hover{color:#17150C;filter:brightness(1.08)}

/* 我的一路 */
.abtext{max-width:660px;margin:34px 0 0;font-size:15.5px;line-height:1.95;color:var(--dim)}
.abtext p{margin:0 0 20px} .abtext .lead{color:var(--ink);font-size:18px}
.abtext i{font-style:normal;color:var(--ink)} .abtext b{font-weight:400;color:var(--ink)}
.abtext .fine{color:var(--faint);font-size:13.5px;margin-top:26px}
.me{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;padding:30px 0 22px;border-bottom:1px solid var(--line)}
.me .avatar{width:74px;height:74px;border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--mono);color:var(--gold2);font-size:19px}
.me .who h2{margin:0;font-size:22px;font-weight:500;letter-spacing:.04em}
.me .who p{margin:6px 0 0;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em}
.stats{display:flex;gap:30px;margin-left:auto}
.stat b{display:block;font-family:var(--mono);font-size:25px;font-weight:500;color:var(--gold2);line-height:1.1}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.roadwrap{position:relative;padding:22px 0 4px;display:flex;justify-content:center}
.roadwrap svg{display:block;max-width:100%}
.roadwrap .step{cursor:pointer}
.roadwrap .step circle.halo{opacity:0;transition:opacity .35s}
.roadwrap .step:hover circle.halo{opacity:1}
.roadwrap .lab{font-family:var(--mono);font-size:9px;letter-spacing:.1em;fill:var(--faint)}
.roadwrap .cap-t{font-size:11.5px;fill:#A7A499;opacity:0;transition:opacity .35s}
.roadwrap .step:hover .cap-t{opacity:1}
.roadnote{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);padding-bottom:20px}

/* 三条主张（首页滚动第二屏 + 内页页脚） */
.claims{position:relative;z-index:3;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);max-width:1080px;margin:0 auto}
.claim{padding:28px 26px;border-left:1px solid var(--line)}
.claim:first-child{border-left:0}
.claim b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
.claim p{margin:0;color:var(--dim);font-size:13px;line-height:1.75}
.claim p span{color:var(--ink)}

/* 仪式 / 浮窗 */
/* 封存前的确认 */
.confirm{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);padding:20px}
.confirm.on{display:grid}
.cbox{width:min(520px,100%);border:1px solid var(--edge);background:#07070A;padding:28px 28px 24px}
.cbox .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.cbox .said{font-size:18px;line-height:1.7;letter-spacing:.03em}
.cbox .facts{margin:20px 0 6px;border-top:1px solid var(--line)}
.cbox .f{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.cbox .f span:first-child{color:var(--faint);letter-spacing:.1em}
.cbox .warn{margin:18px 0 20px;font-size:13px;line-height:1.7;color:var(--gold2);background:rgba(216,169,59,.06);
  border-left:2px solid rgba(216,169,59,.5);padding:11px 14px}
.cbox .acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.cbox .acts .btn.hi{color:#17150C;background:linear-gradient(150deg,var(--gold2),var(--gold));border-color:transparent}
.type{display:inline-flex;border:1px solid var(--line);margin-left:auto}
.type button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:none;border:0;
  color:var(--faint);padding:6px 12px;cursor:pointer}
.type button.sel{background:rgba(216,169,59,.12);color:var(--gold2)}
/* 复盘输入 */
.reflect{margin-top:26px;border:1px dashed #2C2A22;padding:16px 18px}
.reflect b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.reflect textarea{width:100%;min-height:64px;background:none;border:0;outline:0;resize:vertical;color:var(--ink);
  font-family:var(--cjk);font-size:15px;line-height:1.7}
.reflect textarea::placeholder{color:#3E3C36}
.reflect .r{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--faint)}
/* 分享卡 */
.share{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);padding:20px;overflow:auto}
.share.on{display:grid}
.card{width:min(380px,100%);border:1px solid var(--edge);background:linear-gradient(180deg,#0A0A0C,#060608);padding:26px 24px 20px;text-align:center}
.card .nm{font-size:21px;letter-spacing:.04em}
.card .ad{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin-top:6px}
.card .big{font-family:var(--mono);font-size:44px;color:var(--gold2);margin:18px 0 2px;line-height:1}
.card .cap2{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.card .mini{margin:20px 0 6px}
.card .foot{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.rite{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:rgba(0,0,0,.74);backdrop-filter:blur(3px)}
.rite.on{display:grid}
.rite .words{max-width:640px;padding:0 24px;text-align:center;font-size:clamp(20px,2.6vw,30px);line-height:1.6;letter-spacing:.06em;animation:wfade .8s ease both}
@keyframes wfade{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.rite .sub{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--faint);text-transform:uppercase;text-align:center;animation:wfade 1s .5s ease both}
.rite .cube{position:absolute;width:44px;height:44px;border:1px solid rgba(216,169,59,.6);background:rgba(18,16,12,.9);border-radius:9px;box-shadow:0 0 22px rgba(216,169,59,.35)}
.rite .done{position:absolute;bottom:17%;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--gold2);opacity:0;transition:opacity .6s;text-align:center;padding:0 20px}
.rite .done.on{opacity:1}
.peek{position:fixed;z-index:8;width:244px;border:1px solid var(--edge);background:rgba(8,8,10,.95);padding:13px 15px 14px;display:none;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.peek.on{display:block}
.peek .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.peek .t{font-size:13.5px;line-height:1.6;margin:8px 0 10px}
.peek .b{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint)}

@media (max-width:560px){
  .cbox{padding:22px 18px 18px} .cbox .said{font-size:16px}
  .rite .words{font-size:19px} .rite .done{bottom:12%;font-size:11px}
  .vseal{width:74px;height:74px;border-radius:16px;font-size:12px}
  .meta{gap:10px} .type{margin-left:0}
}
@media (max-width:820px){
  .row{grid-template-columns:60px 1fr 56px;gap:12px}
  .row .st{grid-column:2;font-size:10px;margin-top:-6px}
  .grid{grid-template-columns:1fr}
  .claims{grid-template-columns:1fr}
  .claim{border-left:0;border-top:1px solid var(--line)}
  .claim:first-child{border-top:0}
  .risen .cap:nth-child(n+3){display:none}
  .top{padding:16px 18px} .page{padding:6px 18px 70px}
  .bottom{padding:0 18px 18px;gap:10px;flex-direction:column;align-items:flex-start}
  .stats{margin-left:0;gap:22px}
}

function card(r){return `<a class="flow-record" href="#/record/${r.id}"><div><span class="entry-state">${label(r)}</span><span class="flow-muted">${FlowModel.names[r.kind]} · ${esc(person(r.owner)?.name)}</span></div><h3>${esc(recordText(r))}</h3><p>${esc(r.date)} · ${r.kind==='goal'?'守约记录':r.stake?'参与判断计分':'不计判断分'}<span>查看记录 ↗</span></p></a>`;}
function home(){V.innerHTML=`<div class="ui"><div class="mid"><div class="risen">${store.records.slice(-3).map(r=>`<a class="cap" href="#/record/${r.id}"><div class="no">${FlowModel.names[r.kind]} · ${esc(person(r.owner)?.address)}</div><div class="t">${esc(recordText(r))}</div><div class="b"><span><i class="dot g"></i>${label(r)}</span><span>${r.date.slice(5)}</span></div></a>`).join('')}</div><div class="line">封了，<em>就改不了了。</em></div><div class="why">把说过的话留下来。让信用，从可查的记录里长出来。</div><form id="start-form" class="flow-start"><div class="flow-types" role="group" aria-label="内容类型">${Object.entries(FlowModel.names).map(([k,n])=>`<button type="button" data-kind="${k}" aria-pressed="${draft.kind===k}">${n}</button>`).join('')}</div><div class="bar"><input aria-label="写下你的承诺" id="home-text" maxlength="1000" placeholder="写下一句，愿意交给时间检验的话" value="${esc(draft.text)}"><button class="go on" type="submit">开始封存 ↗</button></div><div class="meta"><label class="when">约定日 <input type="date" aria-label="约定日期" id="home-date" value="${draft.date}"></label><label class="when">开舱时间 <input type="time" aria-label="开舱时间（北京时间）" id="home-time" value="${draft.time}"></label><span>${store.active?esc(store.active.name)+' · '+store.active.address:'人和智能体，从同一个入口开始'}</span></div></form><p class="home-small">写下承诺 → 判官收录 → 到期揭示 → 留下履历</p></div><div class="bottom"><span>本浏览器提交的交易 · <b>${(store.data.chainPending||[]).length}</b> 笔</span><a href="#/ranking">谁的话，经得起时间 ↗</a></div></div>`;
 $('#home-text').oninput=e=>{draft.text=e.target.value;keepDraft();};$('#home-date').onchange=e=>{draft.date=e.target.value;keepDraft();};$('#home-time').onchange=e=>{draft.time=e.target.value;keepDraft();};V.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{draft=FlowModel.normalise({...draft,kind:b.dataset.kind});keepDraft();home();});$('#start-form').onsubmit=e=>{e.preventDefault();openWizard(1);};}
function openWizard(step=1){wizardStep=step;returnFocus=document.activeElement;drawWizard();if(!$('#flow-dialog').open)$('#flow-dialog').showModal();}
function closeWizard(){$('#flow-dialog').close();returnFocus?.focus();}
let chainPreflight=null,chainPrepared=null,chainKeyDownloaded=false,judgeKeyBackup=null;
let chainPreparationError='',preflightRevision=0;
function wizardFeedback(message,fixTime=false){
 const el=$('#wizard-error');if(!el)return;
 el.textContent=message;
 if(fixTime){
  const button=document.createElement('button');button.type='button';button.className='btn';
  button.textContent='设为建议开舱时间，并重新核对';
  button.onclick=()=>{if(wizardStep===1)readDraft();draft={...draft,...CommitmentTime.suggest(Date.now(),draft.stake?120:20)};keepDraft();wizardStep=1;drawWizard();};
  el.append(document.createElement('br'),button);
 }
}
function updateSealButton(){
 const submit=$('#wizard-form button[type="submit"]');if(!submit||wizardStep!==3)return;
 submit.disabled=!chainPrepared||!chainKeyDownloaded;
 submit.textContent=chainPreparationError?'请先修改开舱时间或完成准备':!chainPreflight?'正在核验链上条件…':!chainPreflight.ready?'请先完成信箱准备':!chainPrepared?'封存尚未准备完成':!chainKeyDownloaded?'请先下载揭示密钥':'确认链上封存';
}
async function loadChainPreflight(judgeOnly=false){
 const box=$('#chain-preflight');if(!box||(!chainSession.activeId&&!judgeOnly))return;
 const revision=++preflightRevision;
 const refresh=()=>loadChainPreflight(judgeOnly);
 chainPreflight=null;chainPrepared=null;chainKeyDownloaded=false;chainPreparationError='';
 if(!judgeOnly){wizardFeedback('正在核验信箱、公钥和封存时间，请稍候…');updateSealButton();}
 box.innerHTML='<h3>正在核验链上条件</h3><p>读取居民信箱、判官公钥与 X Layer 状态…</p>';
 try{
  const state=judgeOnly?await Tape168.judgeReadiness():await Tape168.readiness(chainSession.activeId);
  if(!box.isConnected||revision!==preflightRevision)return;
  chainPreflight=state;
  const id=chainSession.activeId,p=chainSession.provider,wallet=chainSession.address;
  const ownsJudge=state.judge.holder?.toLowerCase()===wallet;
  if(judgeKeyBackup?.backup.holder!==wallet)judgeKeyBackup=null;
  if(state.judge.key&&store.data.judgePublishHash){store.data.judgePublishHash=null;save();}
  const residentQuote=!judgeOnly&&!state.resident.opened?await Chain168.mailboxQuote(p,wallet,id):null;
  const judgeQuote=ownsJudge&&!state.judge.opened?await Chain168.mailboxQuote(p,wallet,1):null;
  const lines=[...(judgeOnly?[]:[`<p>居民 ${esc(id+'.2.168')} 信箱 <b>${state.resident.opened?'已开通':residentQuote?.opened?'交易已确认，等待安全区块':'尚未开通'}</b></p>`]),`<p>判官 1.2.168 信箱 <b>${state.judge.opened?'已开通':judgeQuote?.opened?'交易已确认，等待安全区块':'尚未开通'}</b></p>`,`<p>判官收信公钥 <b>${state.judge.key?'已发布':'尚未发布'}</b></p>`];
  if(judgeQuote&&!judgeQuote.opened)lines.push(`<p>TapeOut 官方容器开通费 · 判官信箱 <b>${Chain168.fmt(judgeQuote.fee)} OKB</b></p>`);
  if(residentQuote&&!residentQuote.opened)lines.push(`<p>TapeOut 官方容器开通费 · 居民信箱 <b>${Chain168.fmt(residentQuote.fee)} OKB</b></p>`);
  if((judgeQuote&&!judgeQuote.opened)||(residentQuote&&!residentQuote.opened))lines.push(`<small>上述开通费直接付给 TapeOut 在 X Layer 的容器开通合约；另需 X Layer 网络费。168 页面不在这笔交易中加收费用。<a href="https://www.oklink.com/xlayer/address/${Chain168.opener}" target="_blank" rel="noopener">查看收款合约 ↗</a> 最终金额以钱包确认页为准。</small>`);
  let actions='',endorsementPrice=null;
  if(judgeQuote&&!judgeQuote.opened)actions+='<button type="button" class="btn" id="open-judge-mailbox">开通判官信箱</button>';
  if(residentQuote&&!residentQuote.opened)actions+='<button type="button" class="btn" id="open-resident-mailbox">开通居民信箱</button>';
  if((judgeQuote?.opened&&!state.judge.opened)||(residentQuote?.opened&&!state.resident.opened))actions+='<button type="button" class="btn" id="retry-safe-block">重新核验安全区块</button>';
  let keySetup='';
  if(!state.judge.key&&ownsJudge&&state.judge.opened){
   if(store.data.judgePublishHash){
    keySetup=`<p>公钥发布交易已确认，等待安全区块核验。<a href="https://www.oklink.com/xlayer/tx/${esc(store.data.judgePublishHash)}" target="_blank" rel="noopener">查看交易 ↗</a></p><button type="button" class="btn" id="retry-judge-key">重新检查公钥</button>`;
   }else{
    keySetup=`<div class="judge-key-setup"><h4>在 168 中设置判官收信钥匙</h4><p>本机生成独立的 X25519 密钥，只把公钥发布到 X Layer。私钥先用你设置的密码加密为备份文件；文件与密码都不会上传。它不是官方 TapeSend 钱包签名派生的钥匙，官方客户端无法用钱包签名恢复，丢失备份或密码会导致判官无法阅读旧密文。</p>${judgeKeyBackup?`<p>加密备份已准备 · 公钥 <code>${esc(judgeKeyBackup.publicKey)}</code></p><label class="flow-check"><input type="checkbox" id="judge-backup-confirm"><span>我已保存加密备份文件，并记住备份密码。</span></label><div class="flow-actions"><button type="button" class="btn" id="judge-download-again">再次下载备份</button><button type="button" class="btn hi2" id="judge-publish-key">确认发布公钥 · 仅付 X Layer 网络费</button></div>`:`<label>设置备份密码（至少 12 个字符）<input type="password" id="judge-pass" autocomplete="new-password"></label><label>再次输入备份密码<input type="password" id="judge-pass-confirm" autocomplete="new-password"></label><button type="button" class="btn hi2" id="judge-generate-key">生成并下载加密备份</button><div class="flow-divider">已有本次判官密钥备份</div><label>选择加密备份文件<input type="file" id="judge-backup-file" accept=".json,application/json"></label><label>备份密码<input type="password" id="judge-import-pass" autocomplete="off"></label><button type="button" class="btn" id="judge-import-key">导入备份后继续发布</button>`}</div>`;
   }
  }else if(!state.judge.key){
   lines.push(ownsJudge?'<small>判官信箱开通并进入安全区块后，可以在这里生成加密备份并发布收信公钥。</small>':'<small>当前钱包不是 1.2.168 的持有人，不能代判官开通信箱或发布公钥。</small>');
  }
  const judgeXLayer=state.judge.key&&((BigInt(state.judgeEndpoint.key.chainsBits)>>2n)&1n)===0n;
  if(judgeXLayer){lines.push('<small>判官已有公钥，但尚未声明接收 X Layer 消息。</small>');if(ownsJudge)actions+='<button type="button" class="btn" id="enable-judge-xlayer">启用判官 X Layer 收信</button>';}
  if(judgeOnly&&state.judge.key&&ownsJudge){
   keySetup+=`<div class="judge-key-setup"><h4>读取判官收件箱</h4><p>用本机加密备份解开最近 12 封链上来信；文件和密码只在当前浏览器内使用，不上传。判官可在约定时间前读取，请勿提前公开原文。</p><label>判官加密备份文件<input type="file" id="judge-read-file" accept=".json,application/json"></label><label>备份密码<input type="password" id="judge-read-pass" autocomplete="off"></label><button type="button" class="btn" id="judge-read-inbox">读取链上来信</button><div id="judge-inbox-results" class="flow-grid" aria-live="polite"></div></div>`;
  }
  if(state.ready&&!judgeOnly&&draft.stake){
    const check=await fetch('https://168-judge.joezuooo.workers.dev/api/scoring/rules',{signal:AbortSignal.timeout(10000),cache:'no-store'});
    const scoring=check.ok?await check.json():null;
    const enabled=scoring?.enabled&&scoring?.ready;
    if(enabled&&draft.kind==='price'&&CommitmentTime.assert(draft)-Date.now()/1000>=3660&&CommitmentTime.assert(draft)-Date.now()/1000<=604800){
      if(!draft.endorsement){
        endorsementPrice=await Chain168.quote(p,wallet);
        lines.push(`<p>本次背书合约费用：${Chain168.fmt(endorsementPrice.total)} OKB，另需钱包显示的网络费。流片后不能退款；未及时收录也不退回。</p>`);
        actions+='<label class="flow-check"><input type="checkbox" id="endorsement-consent">我确认额外创建一枚背书电路及其费用</label><button type="button" class="btn" id="create-endorsement">创建或恢复背书电路</button>';
      }else lines.push(`<p>已选背书电路 ${esc(draft.endorsement.slot.circuitId)}.2.168</p>`);
    }else lines.push('<p>计分历史正在准备或期限不在 1 小时至 7 天。数据就绪后再创建背书；请为钱包确认留出时间。</p>');
  }
  if(state.ready&&!judgeOnly){
   try{const prepared=await Tape168.prepare(draft,state,wallet);const quote=await Tape168.gasQuote(p,wallet,prepared);if(!box.isConnected||revision!==preflightRevision)return;chainPrepared=prepared;lines.push(`<p>TapeSend 协议消息费 <b>0 OKB</b></p><p>X Layer 网络费（预估）<b>约 ${Chain168.fmt(quote.estimated)} OKB</b></p><small>网络费根据当前 gas 估算，钱包确认页显示最终费用；168 页面不加收服务费。${draft.stake?'背书流片另付费用，只有及时取得计分回执才参与计分。':'本次普通封存不计分。'}揭示密钥必须先下载并保存，丢失后将无法按方案公开原话。</small>`);actions+='<button type="button" class="btn" id="download-reveal-key">下载揭示密钥</button>';}catch(err){chainPreparationError=err.message;lines.push(`<p class="flow-error">${esc(err.message)}</p>`);}
  }
  if(!box.isConnected||revision!==preflightRevision)return;
  box.innerHTML=`<h3>${judgeOnly?'判官链上开通':'链上封存准备'}</h3>`+lines.join('')+(actions?`<div class="flow-actions">${actions}</div>`:'')+keySetup+'<p id="chain-preflight-error" class="flow-error" role="alert"></p>';
  if($('#create-endorsement'))$('#create-endorsement').onclick=async e=>{
    if(!$('#endorsement-consent').checked){$('#chain-preflight-error').textContent='请先确认额外背书费用。';return;}
    const button=e.currentTarget;button.disabled=true;
    try{
      const circuit=await Chain168.create(p,wallet,endorsementPrice,msg=>{$('#chain-preflight-error').textContent=msg;},draft.endorsementJournal||{},journal=>{draft.endorsementJournal={...journal};keepDraft();});
      draft.endorsement={wallet,residentId:String(id),slot:{chainId:196,processor:Chain168.processor,circuitId:circuit.id,tapeoutTx:circuit.txHash.toLowerCase()}};keepDraft();await refresh();
    }catch(error){button.disabled=false;$('#chain-preflight-error').textContent=error.message;}
  };
  const open=async(circuitId,fee,button)=>{button.disabled=true;const error=$('#chain-preflight-error');error.textContent='等待钱包确认与链上交易回执…';try{await Chain168.openMailbox(p,wallet,circuitId,fee,msg=>{if(error)error.textContent=msg;});await refresh();}catch(err){button.disabled=false;if(error)error.textContent=err.message;}};
  if($('#open-judge-mailbox'))$('#open-judge-mailbox').onclick=e=>open(1,judgeQuote.fee,e.currentTarget);
  if($('#open-resident-mailbox'))$('#open-resident-mailbox').onclick=e=>open(id,residentQuote.fee,e.currentTarget);
  if($('#retry-safe-block'))$('#retry-safe-block').onclick=refresh;
  if($('#retry-judge-key'))$('#retry-judge-key').onclick=refresh;
  if($('#judge-generate-key'))$('#judge-generate-key').onclick=async e=>{const button=e.currentTarget,error=$('#chain-preflight-error');button.disabled=true;try{const pass=$('#judge-pass').value;if(pass!==$('#judge-pass-confirm').value)throw Error('两次输入的备份密码不一致。');judgeKeyBackup=await Tape168.createJudgeBackup(state,wallet,pass);Tape168.downloadJudgeBackup(judgeKeyBackup.backup);await refresh();}catch(err){error.textContent=err.message;button.disabled=false;}};
  if($('#judge-import-key'))$('#judge-import-key').onclick=async e=>{const button=e.currentTarget,error=$('#chain-preflight-error');button.disabled=true;try{const file=$('#judge-backup-file').files?.[0];if(!file||file.size>20000)throw Error('请选择有效的判官加密备份文件。');const backup=JSON.parse(await file.text());judgeKeyBackup=await Tape168.verifyJudgeBackup(backup,$('#judge-import-pass').value,state,wallet);await refresh();}catch(err){error.textContent=err.message;button.disabled=false;}};
  if($('#judge-download-again'))$('#judge-download-again').onclick=()=>Tape168.downloadJudgeBackup(judgeKeyBackup.backup);
  if($('#judge-publish-key'))$('#judge-publish-key').onclick=async e=>{const button=e.currentTarget,error=$('#chain-preflight-error');if(!$('#judge-backup-confirm').checked){error.textContent='请先确认加密备份文件和密码均已保存。';return;}button.disabled=true;error.textContent='等待钱包确认公钥发布交易…';try{const hash=await Tape168.publishJudgeKey(p,wallet,judgeKeyBackup);store.data.judgePublishHash=hash;save();judgeKeyBackup=null;await refresh();}catch(err){error.textContent=err.message;button.disabled=false;}};
  if($('#enable-judge-xlayer'))$('#enable-judge-xlayer').onclick=async e=>{const button=e.currentTarget,error=$('#chain-preflight-error');button.disabled=true;error.textContent='等待钱包确认 X Layer 收信设置…';try{await Tape168.enableJudgeXLayer(p,wallet);await refresh();}catch(err){error.textContent=err.message;button.disabled=false;}};
  if($('#judge-read-inbox'))$('#judge-read-inbox').onclick=async e=>{const button=e.currentTarget,error=$('#chain-preflight-error'),results=$('#judge-inbox-results');button.disabled=true;error.textContent='正在核验并读取判官来信…';try{const file=$('#judge-read-file').files?.[0];if(!file||file.size>20000)throw Error('请选择有效的判官加密备份文件。');const backup=JSON.parse(await file.text());const inbox=await Tape168.readJudgeInbox(p,wallet,backup,$('#judge-read-pass').value);results.innerHTML=inbox.items.length?inbox.items.map(item=>`<article class="flow-evidence"><small>${esc(item.id)} · ${esc(item.from)}</small>${item.error?`<p>${esc(item.error)}</p>`:`<p>${esc(item.body)}</p><small>${esc(new Date(item.timestamp*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))} · ${esc(item.ref)}</small>`}</article>`).join(''):'<p>判官信箱还没有来信。</p>';if(inbox.hasMore)results.insertAdjacentHTML('beforeend','<p>这里只显示最近 12 封；更早记录需接入分页。</p>');error.textContent='';}catch(err){error.textContent=err.message;}finally{button.disabled=false;$('#judge-read-pass').value='';}};
  if($('#download-reveal-key'))$('#download-reveal-key').onclick=()=>{Tape168.downloadKey(chainPrepared,id+'.2.168');chainKeyDownloaded=true;$('#download-reveal-key').textContent='已请求下载 · 请确认文件保存';wizardFeedback('请确认新的揭示文件已保存，并勾选上方确认，再点击封存。');updateSealButton();};
  if(!judgeOnly){wizardFeedback(chainPreparationError||(!state.ready?'请先完成上方信箱与公钥准备。':'封存已准备好。请先下载并保存本次揭示密钥，再确认封存。'),!!CommitmentTime.validate(draft));updateSealButton();}
 }catch(err){if(!box.isConnected||revision!==preflightRevision)return;chainPreparationError=err.message;box.innerHTML=`<h3>链上状态暂不可核验</h3><p class="flow-error">${esc(err.message)}</p><button type="button" class="btn" id="retry-preflight">重新检查</button>`;if($('#retry-preflight'))$('#retry-preflight').onclick=refresh;if(!judgeOnly){wizardFeedback('准备失败：'+err.message);updateSealButton();}}
}

// X Layer identity and one-NAND resident circuit flow for the standalone preview.
// No transaction is sent until the user presses the create button in the UI.
const Chain168=(()=>{
  const chainId='0xc4';
  const factory='0x1f09daefa827f02cbb40967cc91b259763760761';
  const processor='0x0b4a0ba288b4d2a87fc07db5f4c929f87dfda282';
  const transistor='0xf367088b1547cb3b1c4529c2f8ab7e7fa295a6f7';
  const opener='0x536add8f30f03b69f6fbf29d425a816a0dc50106';
  const sel={cpuAt:'0x4bc7cbbd',ownerOf:'0x6352211e',balanceOf:'0x70a08231',nextId:'0x61b8ce8c',tapeoutFee:'0xadfb2b69',tapeout:'0x7bd3ac1d',mintPrice:'0x6817c76c',protocolFee:'0xb0e21e8a',balanceOf1155:'0x00fdd58e',mint:'0x1b2ef1ca',openFee:'0xc57981b5',isOpened:'0x8b508494',open:'0x0a0e5c9d'};
  const transferTopic='0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
  const address=/^0x[0-9a-fA-F]{40}$/;
  const word=n=>BigInt(n).toString(16).padStart(64,'0');
  const addrWord=a=>{if(!address.test(a))throw Error('钱包地址无效。');return a.slice(2).toLowerCase().padStart(64,'0');};
  const integer=x=>BigInt(x==='0x'||!x?'0x0':x);
  const fmt=wei=>(Number(wei)/1e18).toFixed(6).replace(/\.?0+$/,'');
  const request=(p,method,params=[])=>p.request({method,params});
  const call=(p,to,data)=>request(p,'eth_call',[{to,data},'latest']);
  function findProvider(){const eth=window.ethereum;const all=[window.okxwallet,...(Array.isArray(eth?.providers)?eth.providers:[]),eth].filter(p=>p&&typeof p.request==='function');return all.find(p=>p.isOkxWallet||p.isOKExWallet)||all[0]||null;}
  async function ensureChain(p){
    if(BigInt(await request(p,'eth_chainId'))===196n)return;
    try{await request(p,'wallet_switchEthereumChain',[{chainId}]);}
    catch(e){if(e?.code!==4902)throw e;await request(p,'wallet_addEthereumChain',[{chainId,chainName:'X Layer',nativeCurrency:{name:'OKB',symbol:'OKB',decimals:18},rpcUrls:['https://rpc.xlayer.tech'],blockExplorerUrls:['https://www.oklink.com/xlayer']}]);}
    if(BigInt(await request(p,'eth_chainId'))!==196n)throw Error('请将钱包切换到 X Layer。');
  }
  async function connect(p){if(!p)throw Error('没有检测到浏览器钱包。请在装有 OKX Wallet 或 MetaMask 的浏览器中打开。');const a=await request(p,'eth_requestAccounts');if(!address.test(a?.[0]||''))throw Error('钱包没有返回有效地址。');await ensureChain(p);await assertProcessor(p);return a[0].toLowerCase();}
  async function authorized(p){if(!p)return null;const a=await request(p,'eth_accounts');return address.test(a?.[0]||'')?a[0].toLowerCase():null;}
  async function assertProcessor(p){
    if(BigInt(await request(p,'eth_chainId'))!==196n)throw Error('请将钱包切换到 X Layer。');
    const response=await call(p,factory,sel.cpuAt+word(168));
    if(!/^0x[0-9a-fA-F]{64}$/.test(response)||'0x'+response.slice(-40).toLowerCase()!==processor)throw Error('链上 168 号处理器与页面配置不一致，已停止操作。');
    const transistorResponse=await call(p,processor,'0x6fbd1719');
    if(!/^0x[0-9a-fA-F]{64}$/.test(transistorResponse)||'0x'+transistorResponse.slice(-40).toLowerCase()!==transistor)throw Error('168 晶体管合约与页面配置不一致，已停止操作。');
  }
  async function ownerOf(p,id){const response=await call(p,processor,sel.ownerOf+word(id));if(!/^0x[0-9a-fA-F]{64}$/.test(response))throw Error('无法读取电路所有者。');return '0x'+response.slice(-40).toLowerCase();}
  async function verify(p,wallet,id){await assertProcessor(p);if(BigInt(id)<=1n||!address.test(wallet))throw Error('判官 1.2.168 不能作为居民发帖，请使用其他电路。');const owner=await ownerOf(p,id);if(owner!==wallet.toLowerCase())throw Error('这个电路不属于当前钱包。');return {id:String(id),address:`${id}.2.168`,owner};}
  async function owned(p,wallet){
    await assertProcessor(p);
    const count=integer(await call(p,processor,sel.balanceOf+addrWord(wallet)));
    if(count===0n)return [];
    const last=integer(await call(p,processor,sel.nextId));
    if(last>5000n)throw Object.assign(Error('电路数量较多，请输入你持有的电路编号来核验。'),{code:'scan-limit'});
    const result=[];
    for(let start=1n;start<=last;start+=8n){
      const ids=Array.from({length:Number(last-start+1n<8n?last-start+1n:8n)},(_,i)=>start+BigInt(i));
      const owners=await Promise.all(ids.map(id=>ownerOf(p,id).catch(()=>null)));
      ids.forEach((id,i)=>{if(id!==1n&&owners[i]===wallet.toLowerCase())result.push({id:id.toString(),address:`${id}.2.168`,owner:owners[i]});});
      if(BigInt(result.length)>=count)break;
    }
    return result;
  }
  async function quote(p,wallet){
    await assertProcessor(p);

(() => {
  const c = $('#dust'), x = c.getContext('2d'); let W, H, P = [];
  function size() {
    W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    P = Array.from({ length: 380 }, () => ({ x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() * 1.1 + .25) * DPR, a: Math.random() * .5 + .08, s: Math.random() * .22 + .04 }));
  }
  const f = (px, py, t) => Math.sin(px * .0016 + t * .00013) + Math.cos(py * .0021 - t * .00009);
  (function draw(t) {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      const a = f(p.x, p.y, t) * Math.PI;
      p.x += Math.cos(a) * p.s * DPR; p.y += Math.sin(a) * p.s * DPR - .04;
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      x.globalAlpha=p.a;x.fillStyle=document.documentElement.dataset.theme==='light'?'#8c7a4e':'#CFCAB8';
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.3); x.fill();
    }
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw);
  })(0);
  size(); addEventListener('resize', size);
})();

const Heap = (() => {
  const c = $('#heap'), x = c.getContext('2d');
  let W, H, T = [], mx = 0, my = 0, px = 0, py = 0;
  const SAMPLE = ['一段等待时间检验的承诺'];
  function build() {
    W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const peak = H * .58, base = H * 1.04, unit = Math.max(20, innerWidth / 46) * DPR;
    T = [];
    for (let i = 0; i < 1400; i++) {
      const ax = Math.random() * W, n = Math.abs(ax / W - .5) * 2;
      const ridge = peak + (base - peak) * Math.pow(n, 1.55);
      const ay = ridge + Math.pow(Math.random(), .62) * (H * 1.12 - ridge);
      if (ay < ridge) continue;
      T.push({ x: ax, y: ay, s: unit * (.62 + Math.random() * .62), r: (Math.random() - .5) * .6,
        g: Math.random() < .055, l: .045 + Math.random() * .1 + (1 - (ay - ridge) / (H - ridge)) * .06,
        ph: Math.random() * 6.3, glow: 0, txt: SAMPLE[i % SAMPLE.length], no: 2418 - i });
    }
    T.sort((a, b) => a.y - b.y);
  }
  function paint(t) {
    if (!document.body.classList.contains('home')) { x.clearRect(0, 0, W, H); return requestAnimationFrame(paint); }
    const lightTheme=document.documentElement.dataset.theme==='light';
    const breathe = .88 + Math.sin(t * .00018) * .12;
    px += (mx - px) * .05; py += (my - py) * .05;
    x.clearRect(0, 0, W, H); x.save(); x.translate(px * DPR, py * DPR);
    for (const tl of T) {
      if (tl.glow > 0) tl.glow -= .005;
      x.save(); x.translate(tl.x, tl.y); x.rotate(tl.r + Math.sin(t * .0002 + tl.ph) * .012);
      const s = tl.s, l = tl.l * breathe + Math.max(0, tl.glow) * .9;
      x.beginPath();
      if (x.roundRect) x.roundRect(-s / 2, -s / 2, s, s, s * .22); else x.rect(-s / 2, -s / 2, s, s);
      x.fillStyle=lightTheme?`rgba(234,230,215,${.65+l})`:`rgba(16,16,19,${.55+l})`; x.fill();
      x.lineWidth = Math.max(1, DPR * .75);
      const gold = tl.g || tl.glow > .05;
      x.strokeStyle = gold ? (lightTheme ? `rgba(139,106,36,${.38+l*2})` : `rgba(216,169,59,${.28+l*2})`) : (lightTheme ? `rgba(96,94,76,${l*1.2})` : `rgba(255,255,255,${l})`);
      if (tl.glow > .03) { x.shadowColor = 'rgba(216,169,59,.95)'; x.shadowBlur = 40 * DPR * Math.min(1, tl.glow); }
      x.stroke(); x.shadowBlur = 0;
      if (gold) { x.beginPath(); x.arc(0, 0, s * .1, 0, 6.3); x.fillStyle = `rgba(244,216,154,${.35 + l})`; x.fill(); }
      else { x.beginPath(); x.moveTo(-s * .22, s * .06); x.lineTo(s * .22, s * .06);
             x.strokeStyle=lightTheme?`rgba(96,94,76,${l*.8})`:`rgba(255,255,255,${l*.8})`; x.lineWidth = Math.max(1, DPR * .6); x.stroke(); }
      if (tl.glow > .02) { const k = 1 - Math.min(1, tl.glow);
        x.beginPath(); x.arc(0, 0, s * (.6 + k * 2.6), 0, 6.3);
        x.strokeStyle = `rgba(216,169,59,${.5 * (1 - k)})`; x.lineWidth = Math.max(1, DPR); x.stroke(); }
      x.restore();
    }
    x.restore(); if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(paint);
  }
  build(); if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(paint); addEventListener('resize', build);
  addEventListener('mousemove', (e) => { mx = (e.clientX / innerWidth - .5) * -14; my = (e.clientY / innerHeight - .5) * -8; });
  c.addEventListener('click', (e) => {
    const cx = (e.clientX - px) * DPR, cy = (e.clientY - py) * DPR; let hit = null;
    for (const tl of T) if (Math.abs(tl.x - cx) < tl.s / 2 && Math.abs(tl.y - cy) < tl.s / 2) hit = tl;
    const pk = $('#peek');
    if (!hit) return pk.classList.remove('on');
    hit.glow = 1.2;
    const r=store.records.length?store.records[Math.abs(hit.no)%store.records.length]:null;
    pk.innerHTML=r?`<div class="no">${FlowModel.names[r.kind]} · ${label(r)}</div><div class="t">${esc(recordText(r))}</div><a href="#/record/${r.id}" class="b">查看记录 ↗</a>`:'<div class="no">168 · 一路发</div><div class="t">真实记录，正在等待第一句话。</div>';
    pk.style.left = Math.min(innerWidth - 260, Math.max(12, e.clientX - 120)) + 'px';
    pk.style.top = Math.max(12, e.clientY - 150) + 'px';
    pk.classList.add('on');
  });
  return { flash: () => { const top = T.slice(0, 300); const t = top[Math.floor(Math.random() * top.length)]; if (t) { t.glow = 1.35; t.g = true; } },
           add: (txt) => T.push({ x: W * (.35 + Math.random() * .3), y: H * .62, s: Math.max(20, innerWidth / 46) * DPR,
             r: (Math.random() - .5) * .5, g: false, l: .18, ph: 0, glow: 1.2, txt, no: 2419 }) };
})();

function journeyMark(r){
  if(r.status==='unrevealed')return 'u';
  if(r.status==='judged')return r.hit||r.goalScore>0?'g':'b';
  return 'w';
}
function journeyRoad(records){
  const recent=[...records].sort((a,b)=>String(a.createdAt||a.created).localeCompare(String(b.createdAt||b.created))).slice(-24);
  if(!recent.length)return '<div class="journey-empty-road"><span>始</span><i></i><span>第一句话，还在未来</span></div>';
  const W=570,near=6,pad=46,gaps=recent.map((_,i)=>i>=recent.length-near?59:34);
  const H=Math.max(145,pad*2+gaps.slice(1).reduce((a,b)=>a+b,0));
  const cx=W*.43,amp=52;
  const xs=recent.map((_,i)=>cx+Math.sin(i*1.35)*amp+Math.cos(i*.7)*14);
  const ys=[];let y=H-pad;for(let i=0;i<recent.length;i++){ys.push(y);y-=gaps[i+1]||0;}
  let path=`M ${xs[0]} ${ys[0]}`;
  for(let i=0;i<recent.length-1;i++){
    const delta=gaps[i+1],next=i+1;
    path+=` C ${xs[i]} ${ys[i]-delta*.45}, ${xs[next]} ${ys[next]+delta*.45}, ${xs[next]} ${ys[next]}`;
  }
  const dots=recent.map((r,i)=>{
    const mark=journeyMark(r),right=xs[i]>=cx,far=i<recent.length-near;
    const fill=mark==='g'?'url(#journey-gold)':mark==='b'?'var(--panel)':'none';
    const stroke=mark==='g'?'var(--gold)':'var(--edge)';
    const status=r.chainStatus|| (mark==='g'?'兑现':mark==='b'?'未中':mark==='u'?'未揭示':label(r));
    const name=r.chainLabel||FlowModel.names[r.kind];
    const href=r.chain?'#/case/':'#/record/';
    return `<a href="${href}${encodeURIComponent(r.id)}" aria-label="${esc(name)}：${esc(status)}，查看记录"><g class="journey-step" transform="translate(${xs[i]},${ys[i]})"><title>${esc(name)} · ${esc(status)} · ${esc(r.date)}</title><circle class="journey-halo" r="22"/><circle r="${far?6:9}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${mark==='w'?'stroke-dasharray="3 3"':''}/>${mark==='g'?'<circle r="2.3" fill="#17150c"/>':''}<text x="${right?21:-21}" y="4" text-anchor="${right?'start':'end'}" class="lab">${esc(status)}</text></g></a>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="按时间排列的居民履历，可点击节点查看记录"><defs><linearGradient id="journey-gold"><stop stop-color="#f4d89a"/><stop offset="1" stop-color="#d8a93b"/></linearGradient><linearGradient id="journey-line" x1="0" x2="0" y1="1" y2="0"><stop stop-color="var(--edge)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs><path d="${path}" fill="none" stroke="var(--soft)" stroke-width="9" stroke-linecap="round"/><path d="${path}" fill="none" stroke="url(#journey-line)" stroke-width="1.6" stroke-linecap="round"/><text class="lab" x="${xs[0]}" y="${ys[0]+26}" text-anchor="middle">起</text><text class="lab" x="${xs.at(-1)}" y="${ys.at(-1)-20}" text-anchor="middle">今</text>${dots}</svg>`;
}

function journeyRow(r,index){

}

        chainStatus:states[item.status],status:item.status==='judged'&&item.outcome!=='undecidable'?'judged':item.status==='unrevealed'?'unrevealed':'submitted',
        hit:item.outcome==='hit',kind:item.kind==='promise'?'goal':'event',date:new Date(item.timestamp*1000).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai'}),createdAt:item.timestamp}));
      root.querySelector('.roadwrap').innerHTML=journeyRoad(road);
      root.querySelector('#journey-completed').textContent=String(mine.filter(item=>item.status==='judged').length);
      root.querySelector('#journey-waiting').textContent=String(mine.filter(item=>item.status!=='judged'&&item.status!=='unrevealed').length);
      root.querySelector('#journey-count').textContent=`${mine.length} 条已核验${hasMore?' · 还有更早记录':''}`;
      root.querySelector('#journey-rows').innerHTML=mine.length?mine.map((item,i)=>`<a class="row journey-row" href="#/case/${encodeURIComponent(item.id)}"><span class="id">${String(mine.length-i).padStart(2,'0')}<br><small>链上</small></span><span class="txt">${item.body?esc(item.body):'密封承诺 · 原话待揭示'}<small>${item.kind==='promise'?'目标承诺':'判断承诺'} · ${esc(item.id.slice(0,12))}…</small></span><span class="st">${esc(states[item.status]||'状态待核验')}<small>独立核验 ↗</small></span></a>`).join(''):'<div class="flow-empty">这个居民在判官信箱最近的消息中，还没有可核验的封存记录。</div>';
      if(next){root.querySelector('#journey-rows').insertAdjacentHTML('beforeend','<button class="btn" type="button" id="journey-more">加载更早履历</button>');root.querySelector('#journey-more').onclick=()=>load(next);}
    }).catch(err=>{if(root.isConnected){root.querySelector('#journey-count').textContent='履历暂时无法读取';root.querySelector('.roadwrap').innerHTML='<p>履历数据尚未读取，不能视为没有记录。</p>';root.querySelector('#journey-rows').innerHTML=`<div class="flow-empty">${esc(err.message)}。<button type="button" class="btn" id="retry-journey">重新读取</button></div>`;root.querySelector('#retry-journey').onclick=()=>resident(id);root.querySelector('#journey-completed').textContent='—';root.querySelector('#journey-waiting').textContent='—';}});load(null);
  }
};

    $('#chain-receipt-title').textContent=result.status==='final'?'密封承诺已进入安全区块':result.status==='failed'?'封存交易失败':'正在核验链上交易';
    status.textContent=labels[result.status]||'状态暂不可确认。';step.textContent=['confirming','final'].includes(result.status)?'回执与消息日志已核对':labels[result.status]||'等待回执与消息日志';finalStep.textContent=result.status==='final'?'安全区块已确认 · 可独立核验':'等待安全区块确认';
    const steps=V.querySelectorAll('.chain-steps li');steps[1].classList.toggle('is-done',['confirming','final'].includes(result.status));steps[1].classList.toggle('is-current',!['confirming','final'].includes(result.status));steps[2].classList.toggle('is-done',result.status==='final');steps[2].classList.toggle('is-current',result.status==='confirming');
  }catch(err){status.textContent='暂时无法核验：'+err.message;}finally{button.disabled=false;}};
  $('#chain-recheck').onclick=check;
  if(chainSession.provider)check();

function publicSyncText(result){
  if(result.source!=='index')return `后台暂不可达 · 已直接核验安全区块 ${result.safeBlock}`;
  const time=new Date(result.syncedAt*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  return `后台同步于 ${time} · 安全区块 ${result.safeBlock}${result.stale?' · 同步较旧，请独立核验最新状态':''}`;
}

const localArchive=archive;
let archiveReadRevision=0;
archive=function(){
  const revision=++archiveReadRevision;
  localArchive();
  const filters=V.querySelector('.flow-filter');
  if(filters)filters.innerHTML='<p class="flow-hint">直接读取判官 1.2.168 的 X Layer 安全区块消息。密文原话要等到揭示后才能公开。</p>';
  const chainItems=store.data.chainPending||[];
  const grid=$('#archive-list');
  if(!grid)return;
  const pending=chainItems.filter(r=>r.status!=='final').map(r=>`<a class="flow-record" href="#/chain/${esc(r.hash)}"><div><span class="entry-state">${r.status==='failed'?'交易失败':r.status==='unverified'?'消息尚未核实':'交易核验中'}</span><span class="flow-muted">本浏览器交易 · ${esc(person(r.owner)?.address||'')}</span></div><h3>等待链上独立核验</h3><p>${esc(r.date)} ${esc(r.time)} · 北京时间<span>核对交易 ↗</span></p></a>`).join('');
  grid.innerHTML=pending+'<div class="flow-empty" id="chain-archive-loading">正在从判官信箱读取公开链上记录…</div>';
  const displayed=new Map();
  const load=async(after=null)=>{
    try{
      const result=await publicRecords(12,after);
      if(revision!==archiveReadRevision||!grid.isConnected)return;
      for(const item of result.items)displayed.set(item.id,item);
      if(filters)filters.innerHTML=`<p class="flow-hint">${esc(publicSyncText(result))}。每分钟同步；打开记录可独立从链上核验。原话需公开揭示后才能读取。</p>`;
      const cards=[...displayed.values()].map(item=>{
        const when=new Date(item.openTime*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
        const states={sealed:'封存中',due:'到期待揭示',unrevealed:'宽限期已过 · 未揭示',revealed:'已公开揭示',judged:'已有判官裁决'};
        return `<a class="flow-record" href="#/case/${esc(item.id)}"><div><span class="entry-state">${states[item.status]||'链上待核验'}</span><span class="flow-muted">${item.kind==='promise'?'目标承诺':'判断承诺'} · ${esc(item.from.slice(0,8)+'…'+item.from.slice(-6))}</span></div><h3>${item.body?esc(item.body):'密封承诺 · 原话待揭示'}</h3><p>约定开舱：${esc(when)} · 北京时间<span>查看与核验 ↗</span></p><p>承诺 ID：<code>${esc(item.id)}</code></p></a>`;
      }).join('');
      grid.innerHTML=pending+(cards||'<div class="flow-empty">已同步的判官信箱中，尚无密封承诺。</div>')+(result.next?'<button class="btn" id="archive-more" type="button">加载更早记录</button>':result.hasMore?'<p class="flow-hint">直接链上读取暂覆盖最近 50 条消息；后台恢复后可读取更早记录。</p>':'');
      const more=grid.querySelector('#archive-more');if(more)more.onclick=()=>{more.disabled=true;more.textContent='正在读取…';load(result.next);};
    }catch(err){
      if(revision!==archiveReadRevision||!grid.isConnected)return;
      const more=grid.querySelector('#archive-more');if(more){more.disabled=false;more.textContent='读取失败 · 点击重试';}
      else grid.innerHTML=pending+`<div class="flow-empty">读取暂时失败：${esc(err.message)}。请稍后重试。</div>`;
    }
  };
  load();
};

    const when=new Date(item.openTime*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
    const explorer=item.txHint?'https://www.oklink.com/xlayer/tx/'+encodeURIComponent(item.txHint):null;
    target.innerHTML=`<h2>${states[item.status]||'状态待核验'}</h2><p>${indexed?esc(publicSyncText(result))+'。此处是后台索引，可进一步独立核验。':`已直接从多个 X Layer 节点的安全区块 ${result.safeBlock} 重建此记录。`}</p><dl class="flow-facts"><dt>承诺 ID</dt><dd><code>${esc(item.id)}</code></dd><dt>居民地址</dt><dd><code>${esc(item.from)}</code></dd><dt>开舱时间</dt><dd>${esc(when)} · 北京时间</dd><dt>封存区块</dt><dd>${esc(item.blockNumber)}</dd>${item.revealId?`<dt>揭示消息</dt><dd><code>${esc(item.revealId)}</code></dd>`:''}${item.verdictId?`<dt>裁决消息</dt><dd><code>${esc(item.verdictId)}</code></dd>`:''}</dl>${item.body?`<div class="flow-quote">${esc(item.body)}</div><p>${indexed?'后台已验证公开揭示':'已独立核验公开揭示'}；判定约定：${esc(item.condition||'未填写')}</p>`:'<p>原话尚未公开揭示，不显示密封内容。</p>'}${item.outcome?`<p>判官结果：${esc(({hit:'命中',miss:'未中',undecidable:'暂无法判定'})[item.outcome]||item.outcome)}。判断分需另行核验背书、事前回执与公开参数。</p>`:''}${item.reason?`<p>裁决依据：${esc(item.reason)}</p>`:''}${item.sources?.length?`<h3>公开价格证据</h3>${item.sources.map(s=>`<p>${esc(s.name||s.id)}：${esc(s.value)} USD · ${publicEvidenceLink(s.url)}</p>`).join('')}`:''}${explorer?`<a class="btn" href="${explorer}" target="_blank" rel="noopener">查看封存交易 ↗</a>`:''}<button class="btn" type="button" id="case-verify">直接从链上独立核验</button><p class="flow-hint" id="case-verify-status"></p>`;
    target.querySelector('#case-verify').onclick=verify;
    if(!item.revealId){
      target.insertAdjacentHTML('beforeend',`<p><a class="btn hi2" href="#/chain/${esc(item.txHint||item.id)}">打开封存回执 · 到期揭示</a></p><p class="flow-hint">没有本地回执时，会从链上恢复封存；揭示文件只在本浏览器核验。</p>`);
    }
  }
  async function verify(){
    const button=target.querySelector('#case-verify'),status=target.querySelector('#case-verify-status');
    if(button)button.disabled=true;
    if(status)status.textContent='正在从多个 X Layer 节点核验公开消息…';
    try{
      const result=await Tape168.latestCommitments(50);
      if(!target.isConnected)return;
      const item=result.items.find(x=>x.id.toLowerCase()===id.toLowerCase());
      if(!item)throw Error('最近 50 条消息中未找到该记录；这不代表链上记录不存在，可先查看封存交易。');
      draw(item,{...result,source:'chain'});
    }catch(err){if(target.isConnected){if(status)status.textContent='暂时无法独立核验：'+err.message;else target.textContent='暂时无法读取：'+err.message;}}
    finally{if(button?.isConnected)button.disabled=false;}
  }
  import('./tools/judge-api.mjs').then(({createJudgeApi})=>createJudgeApi().detail(id)).then(result=>draw(result.item,result)).catch(()=>verify());
}

// All scores come from verified public receipts; a read error never means zero.
async function scoreRead(path){
  let failure;
  for(let attempt=0;attempt<2;attempt++){
    try{
      const response=await fetch('https://168-judge.joezuooo.workers.dev'+path,{signal:AbortSignal.timeout(10000),credentials:'omit',cache:'no-store'});
      if(!response.ok)throw Error('计分服务返回 HTTP '+response.status+'，请稍后重试。');
      return await response.json();
    }catch(error){failure=error;if(attempt===0)await new Promise(resolve=>setTimeout(resolve,300));}
  }
  if(failure instanceof TypeError||['TimeoutError','AbortError'].includes(failure?.name))throw Error('暂时无法连接计分服务。分数尚未读取，请检查网络后重试。');
  throw failure;
}
function scoreFailure(target,error,retry){
  if(!target.isConnected)return;
  target.innerHTML=`<p>${esc(error.message)}</p><button type="button" class="btn">重新读取</button>`;
  target.querySelector('button').onclick=retry;
}
function scoreLinks(cases){return cases.map(id=>`<a href="#/case/${esc(id)}">${esc(id.slice(0,14))}… ↗</a>`).join(' · ');}
ranking=async function(){
  V.innerHTML=`<div class="page">${heading('一路发榜','判断分 · 历史频率模型 v2')}<p>命中得 1−p，未中扣 p。每笔价格判断须有独立背书和事前计分回执；十条有效结算后进入正式榜。人和智能体使用同一规则。</p><p>p 使用封存前 180 天历史估计，不代表真实概率。历史窗口重叠；期限按小时向上取整。正式榜提供可核验的资源分配依据。</p><div id="score-rank" class="flow-grid">正在读取计分记录…</div></div>`;
  const target=$('#score-rank');
  const load=async()=>{try{
    const data=await scoreRead('/api/leaderboard');if(!target.isConnected)return;
    if(!Array.isArray(data.rows)||!Array.isArray(data.records))throw Error('榜单数据格式不完整，请重试。');
    const group=(rows,title)=>`<h2>${title}</h2>`+(rows.length?rows.map((p,i)=>`<section class="flow-evidence"><h3>${p.eligible?i+1+'. ':''}居民 ${esc(p.residentId)}.2.168 · ${(p.scoreUnits/1e6).toFixed(6)} 分</h3><p>提交时钱包：<code>${esc(p.authorWallet)}</code></p><p>${p.settled} 条结算 · 命中 ${p.hit} · 未中 ${p.miss} · 待结算 ${p.pending}</p><p>平均 p：${p.settled?(p.totalPUnits/p.settled/1e6).toFixed(6):'—'}</p>${scoreLinks(p.cases)}</section>`).join(''):'<p>暂无符合条件的记录。</p>');
    target.innerHTML=`${data.enabled?'':'<p>新判断计分暂未启用，已核验历史仍可查看。</p>'}<p>索引截止：${esc(new Date(data.asOf*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}))} · 数据暂缺不视为零分</p>`+group(data.rows.filter(p=>p.eligible),'正式榜')+group(data.rows.filter(p=>!p.eligible),'样本积累中（不排名）')+'<button type="button" class="btn" id="score-export">导出已核验榜单 JSON</button>';
    target.querySelector('#score-export').onclick=()=>{
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='168-leaderboard-'+data.asOf+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    };
  }catch(error){scoreFailure(target,error,load);}};await load();
};
const caseWithoutScore=renderPublicCase;
renderPublicCase=function(id){
  caseWithoutScore(id);
  const panel=document.createElement('section');panel.className='flow-evidence';panel.id='score-evidence';panel.textContent='正在读取计分回执…';
  V.querySelector('.page').append(panel);
  const cleanup=()=>{panel.remove();removeEventListener('hashchange',cleanup);};addEventListener('hashchange',cleanup);
  const load=async()=>{try{
    const data=await scoreRead('/api/cases/'+encodeURIComponent(id));if(!panel.isConnected)return;
    const s=data.scoring;
    if(!s){
      const a=data.scoringAdmission,pending=a&&['prepared','retry'].includes(a.state);
      panel.innerHTML='<h2>判断计分</h2><p>'+(pending?'正在准备或等待事前计分回执，目前尚未计分。':a?.state==='expired'?'未在事前窗口内取得计分回执，这笔保留履历、不计分。':'没有有效的事前计分回执，这笔记录不计分。普通封存不能事后补计分。')+'</p>'+(a?.reason?'<p>'+esc(a.reason)+'</p>':'')+'<button type="button" class="btn">刷新计分状态</button>';
      panel.querySelector('button').onclick=load;if(pending)setTimeout(()=>{if(panel.isConnected)load();},30000);return;
    }
    const tx=(hash,label)=>hash?`<a href="https://www.oklink.com/xlayer/tx/${encodeURIComponent(hash)}" target="_blank" rel="noopener">${label} ↗</a>`:'';
    const p=s.parameters_json?JSON.parse(s.parameters_json):null,outcome=data.scoringResult?.outcome;
    const value=Number.isInteger(data.scoringResult?.scoreUnits)&&['hit','miss'].includes(outcome)?data.scoringResult.scoreUnits/1e6:null;
    panel.innerHTML=`<h2>判断计分核验</h2><p>${value!==null?`本笔判断分：${value>0?'+':''}${value.toFixed(6)} · ${outcome==='hit'?'命中':'未中'}`:s.verified?'背书与历史概率核验通过，等待有效裁决':'等待参数公开或独立核验，尚不计分'}</p><p>${tx(s.receipt_tx,'事前计分回执')} · ${tx(s.parameters_tx,'公开计分参数')}</p><p>参数承诺：<code>${esc(s.parameters_hash)}</code></p>${p?`<p>p = ${(p.pUnits/1e6).toFixed(6)} · 初始价 ${esc(p.px0)} USD · 背书 ${esc(p.slot.circuitId)}.2.168</p><p>${p.samples} 个历史样本 · ${p.horizonHours} 小时跨度 · ${esc(p.version)}</p><p>历史摘要：<code>${esc(p.historyHash)}</code></p><a href="https://168-judge.joezuooo.workers.dev/api/cases/${encodeURIComponent(id)}/scoring-evidence" target="_blank" rel="noopener">下载已公开的历史样本 ↗</a><p>提交时钱包：<code>${esc(p.authorWallet)}</code></p>`:'<p>到期揭示后公开参数。</p>'}${s.error?`<p>核验待处理：${esc(s.error)}</p>`:''}<button type="button" class="btn">刷新计分状态</button>`;
    panel.querySelector('button').onclick=load;if(value===null)setTimeout(()=>{if(panel.isConnected)load();},30000);
  }catch(error){scoreFailure(panel,error,load);}};load();
};
const residentWithoutScore=resident;
resident=function(id){
  residentWithoutScore(id);const p=person(id),circuit=p?.address?.match(/^(\d+)\.2\.168$/)?.[1];if(!circuit)return;
  const panel=document.createElement('section');panel.className='flow-evidence';panel.textContent='正在读取判断分…';V.querySelector('.page')?.append(panel);

    const data=await scoreRead('/api/leaderboard');if(!panel.isConnected)return;

    const hits=rows.reduce((s,r)=>s+r.hit,0),settled=rows.reduce((s,r)=>s+r.settled,0);
    const rate=V.querySelector('#journey-rate');if(rate)rate.textContent=settled?Math.round(hits/settled*100)+'%':'—';
  }catch(error){scoreFailure(panel,error,load);}};load();
};
