<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>168 · 一路发</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000; --ink:#EFEDE6; --dim:#7E7B72; --faint:#3E3C36;
  --gold:#D8A93B; --gold2:#F4D89A; --line:#1A1A1E; --edge:#26251F;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --cjk:'Noto Serif SC','Songti SC','PingFang SC',serif;
  box-sizing:border-box;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
html,body{margin:0;min-height:100%;background:var(--void);color:var(--ink);font-family:var(--cjk)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.home{overflow:hidden;height:100%}
a{color:inherit;text-decoration:none}
canvas{position:fixed;inset:0;display:block}
#dust{z-index:0} #heap{z-index:1;cursor:pointer}
body:not(.home) #heap,body:not(.home) .veil{display:none}
body:not(.home) #dust{opacity:.55}
.veil{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(0,0,0,0) 28%,rgba(0,0,0,.74) 78%)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}

/* ——— 顶栏 ——— */
.top{position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;padding:22px 28px}
.top .tnav{justify-self:end}
.lang{justify-self:center;display:inline-flex;border:1px solid var(--line)}
.lang button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;background:none;border:0;color:var(--faint);padding:5px 11px;cursor:pointer;transition:.3s}
.lang button + button{border-left:1px solid var(--line)}
.lang button.sel{background:rgba(216,169,59,.12);color:var(--gold2)}
.lang button:hover{color:var(--ink)}
.mark{font-family:var(--mono);font-size:15px;letter-spacing:.34em;color:var(--dim)}
.mark b{color:var(--gold2);font-weight:500}
.tnav{display:flex;gap:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.tnav a.on,.tnav a:hover{color:var(--gold2)}

/* ——— 首页 ——— */
.ui{position:relative;z-index:3;height:calc(100vh - 68px);display:flex;flex-direction:column;pointer-events:none}
.ui > *{pointer-events:auto}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 20px;margin-top:-5vh;
  transition:opacity .5s,transform .5s;pointer-events:none}
.mid > *{pointer-events:auto}
.mid.hushed{opacity:0;transform:translateY(-10px);pointer-events:none}
.risen{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:900px}
.cap{width:180px;border:1px solid var(--line);background:rgba(10,10,12,.55);padding:11px 13px 12px;display:block;cursor:pointer;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),border-color .5s,background .5s;animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.cap:hover{transform:translateY(-10px);border-color:var(--edge);background:rgba(14,14,16,.82)}
.cap .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.cap .t{font-size:12.5px;line-height:1.55;color:var(--dim);margin:7px 0 9px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .b{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dot.g{background:var(--gold);box-shadow:0 0 8px rgba(216,169,59,.85)}
.dot.b{background:#2C2A24} .dot.w{background:transparent;border:1px solid var(--faint)}
.cap.hot{border-color:rgba(216,169,59,.34)} .cap.hot .b{color:var(--gold)}
.line{font-size:clamp(19px,2.3vw,26px);letter-spacing:.08em;text-align:center;font-weight:500}
.line em{font-style:normal;color:var(--gold2)}
.why{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-align:center;margin-top:-16px}
.why b{color:var(--dim);font-weight:400;border-bottom:1px dotted #33312B;cursor:help}
.bar{width:min(660px,92vw);border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:14px;padding:12px 4px;transition:border-color .4s}
.bar:focus-within{border-color:#4A4536}
.bar input{flex:1;background:none;border:0;outline:0;color:var(--ink);font-family:var(--cjk);font-size:16px;letter-spacing:.04em}
.bar input::placeholder{color:#49473F}
.go{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);border:1px solid var(--line);background:none;
  padding:8px 14px;cursor:pointer;text-transform:uppercase;white-space:nowrap;transition:.35s}
.go:hover,.go.on{color:var(--gold2);border-color:rgba(216,169,59,.45)}
.meta{width:min(660px,92vw);display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:-14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);min-height:18px;flex-wrap:wrap}
.meta .when{display:flex;gap:8px;align-items:center}
.meta button{font:inherit;background:none;border:0;border-bottom:1px dotted #3A382F;color:var(--dim);cursor:pointer;padding:0 0 2px}
.meta button.sel{color:var(--gold2);border-bottom-color:rgba(216,169,59,.5)}
.meta input[type=date]{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;background:none;border:0;
  border-bottom:1px dotted #3A382F;color:var(--gold2);padding:0 2px 2px;color-scheme:dark;cursor:pointer}
.meta input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.55);cursor:pointer}
.cbox .sign{margin:2px 0 4px}
.cbox .sign label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.cbox .sign input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--ink);
  font-family:var(--cjk);font-size:15px;padding:6px 2px}
.cbox .sign input:focus{border-bottom-color:#4A4536}
.cbox .sign input::placeholder{color:#3E3C36}
.cbox .sign small{display:block;margin-top:8px;font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--faint)}
.pubpick{display:inline-flex;border:1px solid var(--line)}
.pubpick button{font-family:var(--cjk);font-size:13.5px;background:none;border:0;color:var(--faint);padding:7px 18px;cursor:pointer;transition:.3s}
.pubpick button + button{border-left:1px solid var(--line)}
.pubpick button.sel{background:rgba(216,169,59,.12);color:var(--gold2)}
.meta .no{opacity:0;transition:opacity .5s} .meta .no.show{opacity:1}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 22px;font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.bottom a{border-bottom:1px solid #1E1D19;padding-bottom:2px} .bottom a:hover{color:var(--dim)}
.count b{color:var(--dim);font-weight:400}

/* ——— 内页 ——— */
.page{position:relative;z-index:3;max-width:1080px;margin:0 auto;padding:8px 28px 90px}
.back{display:inline-flex;align-items:center;gap:9px;margin:10px 0 -6px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--faint);transition:.3s}
.back:hover{color:var(--gold2)} .back span{font-size:14px;line-height:1}
.head{padding:26px 0 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head h1{margin:6px 0 0;font-size:clamp(23px,2.6vw,31px);font-weight:500;letter-spacing:.04em}
.head .side{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint);text-align:right}
.filters{display:flex;gap:18px;padding:16px 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.filters button{font:inherit;background:none;border:0;color:inherit;cursor:pointer;padding:2px 0;border-bottom:1px solid transparent}
.filters button.on{color:var(--gold2);border-bottom-color:rgba(216,169,59,.5)}

.rows{margin-top:6px}
.row{display:grid;grid-template-columns:76px 1fr 190px 92px;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .3s}
.row:hover{background:rgba(255,255,255,.018)}
.row .id{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em}
.row .txt{font-size:14.5px;line-height:1.6}
.row .txt small{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:5px;letter-spacing:.1em}
.row .st{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.row .seal{justify-self:end}
.seal{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.seal.g{background:linear-gradient(150deg,var(--gold2),var(--gold));color:#17150C;box-shadow:0 0 20px rgba(216,169,59,.25)}
.seal.b{background:#15140F;border:1px solid #33302A;color:#5E5A4C}
.seal.w{border:1px dashed #33312B;color:var(--faint)}

/* 判决页 */
.verdict{max-width:760px;margin:0 auto}
.vtop{text-align:center;padding:46px 0 34px}
.vseal{width:92px;height:92px;border-radius:20px;margin:0 auto 26px;display:grid;place-items:center;font-family:var(--mono);
  font-size:13px;letter-spacing:.14em;animation:stamp .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes stamp{from{transform:scale(1.5) rotate(-8deg);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.vseal.g{background:linear-gradient(150deg,var(--gold2),var(--gold));color:#17150C;box-shadow:0 0 60px rgba(216,169,59,.3)}
.vseal.b{background:#111008;border:1px solid #33302A;color:#6A6555}
.vtop .said{font-size:clamp(20px,2.5vw,27px);line-height:1.62;letter-spacing:.04em;margin:0 auto;max-width:600px}
.vtop .locked{display:inline-block;border:1px dashed #33312B;color:var(--faint);font-family:var(--mono);font-size:13px;
  letter-spacing:.16em;padding:16px 28px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 8px,transparent 8px 16px)}
.vtop .who{margin-top:18px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:34px}
.cell{background:var(--void);padding:18px 20px}
.cell b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.cell .v{font-family:var(--mono);font-size:14px;color:var(--ink);word-break:break-all}
.cell .v small{color:var(--dim);font-size:11.5px}
.sources{margin-top:26px;border:1px solid var(--line)}
.sources .h{padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.src{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;align-items:center}
.src:last-child{border-bottom:0}
.src .n{color:var(--dim)} .src .p{color:var(--ink)} .src .l{color:var(--faint);font-size:10px}
.note{margin-top:26px;border-left:2px solid #2C2A22;padding:4px 0 4px 18px}
.note .q{font-size:15.5px;line-height:1.75}
.note .by{margin-top:10px;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.12em}
.vfoot{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line);
  padding:11px 20px;color:var(--dim);cursor:pointer;background:none;transition:.35s}
.btn:hover{color:var(--gold2);border-color:rgba(216,169,59,.4)}
.btn.hi2{color:#17150C;background:linear-gradient(150deg,var(--gold2),var(--gold));border-color:transparent}
.btn.hi2:hover{color:#17150C;filter:brightness(1.08)}

/* 我的一路 */
.abtext{max-width:660px;margin:34px 0 0;font-size:15.5px;line-height:1.95;color:var(--dim)}
.abtext p{margin:0 0 20px} .abtext .lead{color:var(--ink);font-size:18px}
.abtext i{font-style:normal;color:var(--ink)} .abtext b{font-weight:400;color:var(--ink)}
.abtext .fine{color:var(--faint);font-size:13.5px;margin-top:26px}
.me{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;padding:30px 0 22px;border-bottom:1px solid var(--line)}
.me .avatar{width:74px;height:74px;border:1px solid var(--edge);display:grid;place-items:center;font-family:var(--mono);color:var(--gold2);font-size:19px}
.me .who h2{margin:0;font-size:22px;font-weight:500;letter-spacing:.04em}
.me .who p{margin:6px 0 0;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em}
.stats{display:flex;gap:30px;margin-left:auto}
.stat b{display:block;font-family:var(--mono);font-size:25px;font-weight:500;color:var(--gold2);line-height:1.1}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.roadwrap{position:relative;padding:22px 0 4px;display:flex;justify-content:center}
.roadwrap svg{display:block;max-width:100%}
.roadwrap .step{cursor:pointer}
.roadwrap .step circle.halo{opacity:0;transition:opacity .35s}
.roadwrap .step:hover circle.halo{opacity:1}
.roadwrap .lab{font-family:var(--mono);font-size:9px;letter-spacing:.1em;fill:var(--faint)}
.roadwrap .cap-t{font-size:11.5px;fill:#A7A499;opacity:0;transition:opacity .35s}
.roadwrap .step:hover .cap-t{opacity:1}
.roadnote{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);padding-bottom:20px}

/* 三条主张（首页滚动第二屏 + 内页页脚） */
.claims{position:relative;z-index:3;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);max-width:1080px;margin:0 auto}
.claim{padding:28px 26px;border-left:1px solid var(--line)}
.claim:first-child{border-left:0}
.claim b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:9px}
.claim p{margin:0;color:var(--dim);font-size:13px;line-height:1.75}
.claim p span{color:var(--ink)}

/* 仪式 / 浮窗 */
/* 封存前的确认 */
.confirm{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);padding:20px}
.confirm.on{display:grid}
.cbox{width:min(520px,100%);border:1px solid var(--edge);background:#07070A;padding:28px 28px 24px}
.cbox .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.cbox .said{font-size:18px;line-height:1.7;letter-spacing:.03em}
.cbox .facts{margin:20px 0 6px;border-top:1px solid var(--line)}
.cbox .f{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.cbox .f span:first-child{color:var(--faint);letter-spacing:.1em}
.cbox .warn{margin:18px 0 20px;font-size:13px;line-height:1.7;color:var(--gold2);background:rgba(216,169,59,.06);
  border-left:2px solid rgba(216,169,59,.5);padding:11px 14px}
.cbox .acts{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.cbox .acts .btn.hi{color:#17150C;background:linear-gradient(150deg,var(--gold2),var(--gold));border-color:transparent}
.type{display:inline-flex;border:1px solid var(--line);margin-left:auto}
.type button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:none;border:0;
  color:var(--faint);padding:6px 12px;cursor:pointer}
.type button.sel{background:rgba(216,169,59,.12);color:var(--gold2)}
/* 复盘输入 */
.reflect{margin-top:26px;border:1px dashed #2C2A22;padding:16px 18px}
.reflect b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.reflect textarea{width:100%;min-height:64px;background:none;border:0;outline:0;resize:vertical;color:var(--ink);
  font-family:var(--cjk);font-size:15px;line-height:1.7}
.reflect textarea::placeholder{color:#3E3C36}
.reflect .r{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--faint)}
/* 分享卡 */
.share{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(0,0,0,.82);backdrop-filter:blur(4px);padding:20px;overflow:auto}
.share.on{display:grid}
.card{width:min(380px,100%);border:1px solid var(--edge);background:linear-gradient(180deg,#0A0A0C,#060608);padding:26px 24px 20px;text-align:center}
.card .nm{font-size:21px;letter-spacing:.04em}
.card .ad{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);margin-top:6px}
.card .big{font-family:var(--mono);font-size:44px;color:var(--gold2);margin:18px 0 2px;line-height:1}
.card .cap2{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.card .mini{margin:20px 0 6px}
.card .foot{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.rite{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:rgba(0,0,0,.74);backdrop-filter:blur(3px)}
.rite.on{display:grid}
.rite .words{max-width:640px;padding:0 24px;text-align:center;font-size:clamp(20px,2.6vw,30px);line-height:1.6;letter-spacing:.06em;animation:wfade .8s ease both}
@keyframes wfade{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.rite .sub{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--faint);text-transform:uppercase;text-align:center;animation:wfade 1s .5s ease both}
.rite .cube{position:absolute;width:44px;height:44px;border:1px solid rgba(216,169,59,.6);background:rgba(18,16,12,.9);border-radius:9px;box-shadow:0 0 22px rgba(216,169,59,.35)}
.rite .done{position:absolute;bottom:17%;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--gold2);opacity:0;transition:opacity .6s;text-align:center;padding:0 20px}
.rite .done.on{opacity:1}
.peek{position:fixed;z-index:8;width:244px;border:1px solid var(--edge);background:rgba(8,8,10,.95);padding:13px 15px 14px;display:none;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.peek.on{display:block}
.peek .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--faint)}
.peek .t{font-size:13.5px;line-height:1.6;margin:8px 0 10px}
.peek .b{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--faint)}

@media (max-width:560px){
  .cbox{padding:22px 18px 18px} .cbox .said{font-size:16px}
  .rite .words{font-size:19px} .rite .done{bottom:12%;font-size:11px}
  .vseal{width:74px;height:74px;border-radius:16px;font-size:12px}
  .meta{gap:10px} .type{margin-left:0}
}
@media (max-width:820px){
  .row{grid-template-columns:60px 1fr 56px;gap:12px}
  .row .st{grid-column:2;font-size:10px;margin-top:-6px}
  .grid{grid-template-columns:1fr}
  .claims{grid-template-columns:1fr}
  .claim{border-left:0;border-top:1px solid var(--line)}
  .claim:first-child{border-top:0}
  .risen .cap:nth-child(n+3){display:none}

// ————— 一路：把每一枚舱串成一条蜿蜒的路 —————
function roadSVG(road, width) {
  // 你自己的那一小堆：从下往上，最早的在最底下，慢慢往上长。
  // 越近的越舒展，越早的挤在一起 —— 像地基。
  const marks = road.split('');
  const n = marks.length, W = width || 560, small = !!width;
  const near = small ? 4 : 6;
  const stepNear = small ? 40 : 62, stepFar = small ? 22 : 34;
  const padY = small ? 26 : 44;
  const gaps = marks.map((_, i) => (i >= n - near ? stepNear : stepFar));
  const H = padY * 2 + gaps.slice(1).reduce((a, b) => a + b, 0);
  const cx = W * (small ? .5 : .42), amp = small ? 30 : 52;
  const xs = marks.map((_, i) => cx + Math.sin(i * 1.35) * amp + Math.cos(i * .7) * (small ? 8 : 14));
  const ys = []; let y = H - padY;
  for (let i = 0; i < n; i++) { ys.push(y); y -= gaps[i + 1] || 0; }
  let d = `M ${xs[0]} ${ys[0]}`;
  for (let i = 0; i < n - 1; i++) {
    const x1 = xs[i], y1 = ys[i], x2 = xs[i + 1], y2 = ys[i + 1], sp = gaps[i + 1] || stepNear;
    d += ` C ${x1} ${y1 - sp * .45}, ${x2} ${y2 + sp * .45}, ${x2} ${y2}`;
  }
  const mine = CAPS.filter((c) => c.by === ME.name);
  const dot = (m, i) => {
    const c = mine[i % mine.length] || {};
    const fill = m === 'g' ? 'url(#gold)' : m === 'b' ? '#16150F' : 'none';
    const stroke = m === 'g' ? 'none' : m === 'b' ? '#34312A' : '#3A382F';
    const dash = m === 'w' ? 'stroke-dasharray="3 3"' : '';
    const far = i < n - near;
    const r = (m === 'w' ? 7 : 8.5) * (far ? .62 : 1);
    if (small) return `<g transform="translate(${xs[i]},${ys[i]})"><circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.3" ${dash}/>${m === 'g' ? '<circle r="2.4" fill="#17150C"/>' : ''}</g>`;
    const right = xs[i] >= cx;
    return `<g class="step" transform="translate(${xs[i]},${ys[i]})" onclick="location.hash='#/c/${c.no || 12}'">
      <circle class="halo" r="21" fill="none" stroke="rgba(216,169,59,.35)"/>
      <circle r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.4" ${dash}/>
      ${m === 'g' ? '<circle r="2.8" fill="#17150C"/>' : ''}
      <text class="lab" x="${right ? 20 : -20}" y="-2" text-anchor="${right ? 'start' : 'end'}" ${far ? 'opacity=".55"' : ''}>${m === 'g' ? T('hit') : m === 'b' ? T('miss') : T('sealing')}</text>
      <text class="cap-t" x="${right ? 20 : -20}" y="13" text-anchor="${right ? 'start' : 'end'}">${esc((c.t || '').slice(0, 14))}</text>
    </g>`;
  };
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="我的一路">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4D89A"/><stop offset="1" stop-color="#D8A93B"/></linearGradient>
      <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#232119"/><stop offset=".6" stop-color="#3A382F"/><stop offset="1" stop-color="#5A5443"/></linearGradient>
    </defs>
    <path d="${d}" fill="none" stroke="rgba(216,169,59,.10)" stroke-width="9" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round"/>
    ${small ? '' : `<text class="lab" x="${xs[0]}" y="${ys[0] + 26}" text-anchor="middle">起</text>
    <text class="lab" x="${xs[n - 1]}" y="${ys[n - 1] - 20}" text-anchor="middle">今</text>`}
    ${marks.map(dot).join('')}
  </svg>`;
}

// 分享图：用 canvas 直接画一张 900×1400 的竖版 PNG，不依赖任何外部库
async function downloadCard(d) {
  const W = 900, H = 1400, S = 2, c = document.createElement('canvas');
  c.width = W * S; c.height = H * S;
  const x = c.getContext('2d'); x.scale(S, S);
  const mono = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const cjk = '"Noto Serif SC", "Songti SC", "PingFang SC", serif';
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  // 底
  const bg = x.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0A0A0C'); bg.addColorStop(1, '#050507');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  // 尘埃
  for (let i = 0; i < 260; i++) {
    x.globalAlpha = Math.random() * .35 + .05; x.fillStyle = '#CFCAB8';
    x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 1.6 + .3, 0, 6.3); x.fill();
  }
  x.globalAlpha = 1;
  x.strokeStyle = '#26251F'; x.lineWidth = 1; x.strokeRect(28.5, 28.5, W - 57, H - 57);
  const mid = W / 2;
  x.textAlign = 'center';
  x.fillStyle = '#8A8778'; x.font = `20px ${mono}`;
  x.fillText('168 · ' + T('brand').toUpperCase(), mid, 96);
  x.fillStyle = '#EFEDE6'; x.font = `46px ${cjk}`;
  x.fillText(d.name, mid, 176);
  x.fillStyle = '#4A4840'; x.font = `20px ${mono}`;
  x.fillText(d.w, mid, 214);
  // 命中率
  x.fillStyle = '#F4D89A'; x.font = `128px ${mono}`;
  x.fillText(d.rate + '%', mid, 372);
  x.fillStyle = '#7E7B72'; x.font = `22px ${mono}`;
  x.fillText(T('cardStat', d.n, d.g, d.b), mid, 414);
  // 路
  const marks = d.road.split(''), n = marks.length;
  const top = 500, bot = H - 240, step = (bot - top) / Math.max(1, n - 1), amp = 92;
  const xs = marks.map((_, i) => mid + Math.sin(i * 1.35) * amp + Math.cos(i * .7) * 22);
  const ys = marks.map((_, i) => bot - i * step);
  x.beginPath(); x.moveTo(xs[0], ys[0]);
  for (let i = 0; i < n - 1; i++) x.bezierCurveTo(xs[i], ys[i] - step * .45, xs[i + 1], ys[i + 1] + step * .45, xs[i + 1], ys[i + 1]);
  x.strokeStyle = 'rgba(216,169,59,.14)'; x.lineWidth = 14; x.lineCap = 'round'; x.stroke();
  x.strokeStyle = '#3A382F'; x.lineWidth = 2; x.stroke();
  marks.forEach((m, i) => {
    x.beginPath(); x.arc(xs[i], ys[i], m === 'w' ? 11 : 14, 0, 6.3);
    if (m === 'g') { const gr = x.createLinearGradient(xs[i] - 14, ys[i] - 14, xs[i] + 14, ys[i] + 14);
      gr.addColorStop(0, '#F4D89A'); gr.addColorStop(1, '#D8A93B'); x.fillStyle = gr; x.fill();
      x.beginPath(); x.arc(xs[i], ys[i], 4.5, 0, 6.3); x.fillStyle = '#17150C'; x.fill(); }
    else if (m === 'b') { x.fillStyle = '#16150F'; x.fill(); x.strokeStyle = '#34312A'; x.lineWidth = 2; x.stroke(); }
    else { x.strokeStyle = '#3A382F'; x.lineWidth = 2; x.setLineDash([4, 4]); x.stroke(); x.setLineDash([]); }
  });
  // 页脚
  x.strokeStyle = '#1A1A1E'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(90, H - 150); x.lineTo(W - 90, H - 150); x.stroke();
  x.fillStyle = '#4A4840'; x.font = `19px ${mono}`;
  x.fillText(T('cardFoot'), mid, H - 112);
  x.fillStyle = '#7E7B72'; x.font = `21px ${cjk}`;
  x.fillText(T('hl1') + T('hl2') + T('hl3'), mid, H - 74);
  const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
  if (!blob) throw new Error('toBlob');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `168-${(d.name || 'me').replace(/[^\w\u4e00-\u9fa5-]/g, '')}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    b.classList.add('sel');
    if (Number(b.dataset.d) === 0) {                 // 自定：露出日期选择
      pick.hidden = false; refresh();

  seal.onclick = () => {

    ].map(([k, v]) => `<div class="f"><span>${k}</span><span style="text-align:right">${esc(v)}</span></div>`).join('');
    $('#pubLab').textContent = T('pubTitle');
    const pb = $('#pubPick').children;
    pb[0].textContent = T('pubOpen'); pb[1].textContent = T('pubSealed');
    const paintPub = () => { pb[0].classList.toggle('sel', !locked); pb[1].classList.toggle('sel', !!locked);
      $('#pubNote').textContent = locked ? T('pubSealedNote') : T('pubOpenNote'); };

    const steps = [T('riteA'), T('riteB'), T('riteC')];

    setTimeout(() => {
      clearInterval(iv); $('#riteSub').textContent = T('riteDone');

      rite.appendChild(cube);
      requestAnimationFrame(() => {

        cube.style.opacity = '0';
      });
      setTimeout(() => { cube.remove(); Heap.add(text); $('#riteNo').textContent = '2,419';
        $('#riteDone').classList.add('on'); ME.name = name || ME.name; }, 950);
      setTimeout(() => {
        rite.classList.remove('on'); $('#riteDone').classList.remove('on');
        const mid = $('#mid'); if (mid) mid.classList.remove('hushed');
        const qq = $('#q'); if (qq) { qq.value = ''; refresh(); }
        const n = $('#n'); if (n) n.textContent = '2,419';
      }, 2100);
    }, 1900);

  refresh();

// ————— 尘埃 —————
(() => {
  const c = $('#dust'), x = c.getContext('2d'); let W, H, P = [];
  function size() {
    W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    P = Array.from({ length: 380 }, () => ({ x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() * 1.1 + .25) * DPR, a: Math.random() * .5 + .08, s: Math.random() * .22 + .04 }));
  }
  const f = (px, py, t) => Math.sin(px * .0016 + t * .00013) + Math.cos(py * .0021 - t * .00009);
  (function draw(t) {
    x.clearRect(0, 0, W, H);
    for (const p of P) {
      const a = f(p.x, p.y, t) * Math.PI;
      p.x += Math.cos(a) * p.s * DPR; p.y += Math.sin(a) * p.s * DPR - .04;
      if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
      x.globalAlpha = p.a; x.fillStyle = '#CFCAB8';
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.3); x.fill();
    }
    requestAnimationFrame(draw);
  })(0);
  size(); addEventListener('resize', size);
})();

// ————— 山 —————
const Heap = (() => {
  const c = $('#heap'), x = c.getContext('2d');
  let W, H, T = [], mx = 0, my = 0, px = 0, py = 0;
  const SAMPLE = CAPS.map((c) => c.t).concat(['今年练到能跑半马', '这轮牛市还没结束', '三年内搬去另一个城市']);
  function build() {
    W = c.width = innerWidth * DPR; H = c.height = innerHeight * DPR;
    c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
    const peak = H * .58, base = H * 1.04, unit = Math.max(20, innerWidth / 46) * DPR;
    T = [];
    for (let i = 0; i < 2200; i++) {
      const ax = Math.random() * W, n = Math.abs(ax / W - .5) * 2;
      const ridge = peak + (base - peak) * Math.pow(n, 1.55);
      const ay = ridge + Math.pow(Math.random(), .62) * (H * 1.12 - ridge);
      if (ay < ridge) continue;
      T.push({ x: ax, y: ay, s: unit * (.62 + Math.random() * .62), r: (Math.random() - .5) * .6,
        g: Math.random() < .055, l: .045 + Math.random() * .1 + (1 - (ay - ridge) / (H - ridge)) * .06,
        ph: Math.random() * 6.3, glow: 0, txt: SAMPLE[i % SAMPLE.length], no: 2418 - i });
    }
    T.sort((a, b) => a.y - b.y);
  }
  function paint(t) {
    if (!document.body.classList.contains('home')) { x.clearRect(0, 0, W, H); return requestAnimationFrame(paint); }
    const breathe = .88 + Math.sin(t * .00018) * .12;
    px += (mx - px) * .05; py += (my - py) * .05;
    x.clearRect(0, 0, W, H); x.save(); x.translate(px * DPR, py * DPR);
    for (const tl of T) {
      if (tl.glow > 0) tl.glow -= .005;
      x.save(); x.translate(tl.x, tl.y); x.rotate(tl.r + Math.sin(t * .0002 + tl.ph) * .012);
      const s = tl.s, l = tl.l * breathe + Math.max(0, tl.glow) * .9;
      x.beginPath();
      if (x.roundRect) x.roundRect(-s / 2, -s / 2, s, s, s * .22); else x.rect(-s / 2, -s / 2, s, s);
      x.fillStyle = `rgba(16,16,19,${.55 + l})`; x.fill();
      x.lineWidth = Math.max(1, DPR * .75);
      const gold = tl.g || tl.glow > .05;
      x.strokeStyle = gold ? `rgba(216,169,59,${.28 + l * 2})` : `rgba(255,255,255,${l})`;
      if (tl.glow > .03) { x.shadowColor = 'rgba(216,169,59,.95)'; x.shadowBlur = 40 * DPR * Math.min(1, tl.glow); }
      x.stroke(); x.shadowBlur = 0;
      if (gold) { x.beginPath(); x.arc(0, 0, s * .1, 0, 6.3); x.fillStyle = `rgba(244,216,154,${.35 + l})`; x.fill(); }
      else { x.beginPath(); x.moveTo(-s * .22, s * .06); x.lineTo(s * .22, s * .06);
             x.strokeStyle = `rgba(255,255,255,${l * .8})`; x.lineWidth = Math.max(1, DPR * .6); x.stroke(); }
      if (tl.glow > .02) { const k = 1 - Math.min(1, tl.glow);
        x.beginPath(); x.arc(0, 0, s * (.6 + k * 2.6), 0, 6.3);
        x.strokeStyle = `rgba(216,169,59,${.5 * (1 - k)})`; x.lineWidth = Math.max(1, DPR); x.stroke(); }
      x.restore();
    }
    x.restore(); requestAnimationFrame(paint);
  }
  build(); requestAnimationFrame(paint); addEventListener('resize', build);
  addEventListener('mousemove', (e) => { mx = (e.clientX / innerWidth - .5) * -14; my = (e.clientY / innerHeight - .5) * -8; });
  c.addEventListener('click', (e) => {
    const cx = (e.clientX - px) * DPR, cy = (e.clientY - py) * DPR; let hit = null;
    for (const tl of T) if (Math.abs(tl.x - cx) < tl.s / 2 && Math.abs(tl.y - cy) < tl.s / 2) hit = tl;
    const pk = $('#peek');
    if (!hit) return pk.classList.remove('on');
    hit.glow = 1.2;
    pk.innerHTML = `<div class="no">#${String(hit.no).padStart(3, '0')} · 2.168</div>
      <div class="t">${esc(hit.txt)}</div>
      <div class="b"><span>${hit.g ? T('openedOn', '') + T('hit') : T('sealing')}</span><span>${T('verify')}</span></div>`;
    pk.style.left = Math.min(innerWidth - 260, Math.max(12, e.clientX - 120)) + 'px';
    pk.style.top = Math.max(12, e.clientY - 150) + 'px';
    pk.classList.add('on');
  });
  return { flash: () => { const top = T.slice(0, 300); const t = top[Math.floor(Math.random() * top.length)]; if (t) { t.glow = 1.35; t.g = true; } },
           add: (txt) => T.push({ x: W * (.35 + Math.random() * .3), y: H * .62, s: Math.max(20, innerWidth / 46) * DPR,
             r: (Math.random() - .5) * .5, g: false, l: .18, ph: 0, glow: 1.2, txt, no: 2419 }) };
})();
setInterval(() => Heap.flash(), 4200); setTimeout(() => Heap.flash(), 1800);
